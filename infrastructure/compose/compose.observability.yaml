# Observability: the collector the binaries already talk to, and the two things that read it.
#
#   docker compose -f infrastructure/compose/compose.yaml -f infrastructure/compose/compose.observability.yaml up --build
#
# This variant adds the collector, Prometheus and Grafana; it does not switch tracing on, because nothing here emits spans.
# The binaries used to be handed OTEL_EXPORTER_OTLP_ENDPOINT and the header above said tracing came on with no binary change,
# but no OpenTelemetry exporter is linked into any binary, so the collector received nothing while the estate read as traced.
# The variable is gone until something actually exports; what this variant does observe is the estate's own metrics.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../../otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../../prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    restart: unless-stopped
