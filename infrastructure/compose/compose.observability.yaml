# Observability: the collector the binaries already talk to, and the two things that read it.
#
#   docker compose -f infrastructure/compose/compose.yaml -f infrastructure/compose/compose.observability.yaml up --build
#
# OTEL_EXPORTER_OTLP_ENDPOINT already points at otel-collector in the base file, so adding this file is the whole of
# switching tracing on: no binary changes, no rebuild with a different feature.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../../otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../../prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    restart: unless-stopped
