# The platform, as containers.
#
# What is actually running: one engine that answers every address, one gateway in front of it, one worker that runs the
# schedules, one sync server for devices, and the database they share. This file used to list forty services, each with
# its own container and its own port, and every one of them has since been retired into the engine - which is why the
# list is short now. It is short because of the architecture, not because a cleanup pass went through it.
#
#   docker compose -f infrastructure/compose/compose.yaml up --build
#
# The variants beside it add to this file rather than repeating it:
#
#   compose.dev.yaml            build from source, ports published, store on disk
#   compose.test.yaml           throwaway, no database, nothing published
#   compose.observability.yaml  otel collector, prometheus, grafana

name: vimbai

services:
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-vimbai-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  engine:
    build:
      context: ../../rust
      dockerfile: ../infrastructure/docker/Dockerfile.rust
      args:
        PACKAGE: vimbai_api
        BIN: vimbai-api
    image: vimbai/engine:local
    environment:
      VIMBAI_API_ADDR: 0.0.0.0:8099
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vimbai-dev-password}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8099/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: ../../gateway/go
      dockerfile: ../../infrastructure/docker/Dockerfile.gateway
    image: vimbai/gateway:local
    environment:
      PORT: "8081"
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../../rust
      dockerfile: ../infrastructure/docker/Dockerfile.rust
      args:
        PACKAGE: vimbai_worker
        BIN: vimbai-worker
    image: vimbai/worker:local
    environment:
      VIMBAI_WORKER_INTERVAL_SECONDS: "30"
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vimbai-dev-password}
    depends_on:
      engine:
        condition: service_healthy
    # the worker serves no port, so the image's health probe does not apply to it
    healthcheck:
      disable: true
    restart: unless-stopped

  sync:
    build:
      context: ../../rust
      dockerfile: ../infrastructure/docker/Dockerfile.rust
      args:
        PACKAGE: vimbai_sync
        BIN: vimbai-sync
    image: vimbai/sync:local
    environment:
      # the sync server keeps its own store file unless it is pointed at the engine's database
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vimbai-dev-password}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8099/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The app, for the web. Off by default: `docker compose ... --profile web up` builds it, because pulling a Flutter
  # toolchain is not something a `docker compose up` should do behind your back while you are looking at the engine.
  web:
    profiles: ["web"]
    build:
      context: ../../apps/flutter
      dockerfile: ../../infrastructure/docker/Dockerfile.flutter-web
    image: vimbai/flutter-web:local
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  neo4j-data:
