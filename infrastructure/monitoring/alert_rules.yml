# Vimbai Prometheus Alert Rules

groups:
  # Service Availability Alerts
  - name: vimbai.availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

      - alert: HighErrorRate
        expr: |
          sum(rate(vimbai_http_requests_total{status_code=~"5.."}[5m])) by (service)
          / sum(rate(vimbai_http_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} which exceeds 5% threshold"

      - alert: ElevatedErrorRate
        expr: |
          sum(rate(vimbai_http_requests_total{status_code=~"5.."}[5m])) by (service)
          / sum(rate(vimbai_http_requests_total[5m])) by (service) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} which exceeds 1% threshold"

  # Latency Alerts
  - name: vimbai.latency
    rules:
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(vimbai_http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High latency on {{ $labels.service }}"
          description: "P95 latency is {{ $value }}s which exceeds 2s threshold"

      - alert: ElevatedLatency
        expr: |
          histogram_quantile(0.95, sum(rate(vimbai_http_request_duration_seconds_bucket[5m])) by (le, service)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated latency on {{ $labels.service }}"
          description: "P95 latency is {{ $value }}s which exceeds 1s threshold"

      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95, sum(rate(vimbai_db_query_duration_seconds_bucket[5m])) by (le, service, operation)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries on {{ $labels.service }}"
          description: "P95 query duration for {{ $labels.operation }} is {{ $value }}s"

  # Database Alerts
  - name: vimbai.database
    rules:
      - alert: DatabaseConnectionExhaustion
        expr: |
          vimbai_db_connection_pool_used / vimbai_db_connection_pool_size > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "Connection pool usage is {{ $value | humanizePercentage }}"

      - alert: HighDatabaseErrorRate
        expr: |
          sum(rate(vimbai_db_errors_total[5m])) by (service) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database error rate on {{ $labels.service }}"
          description: "Database errors per second: {{ $value }}"

  # System Resource Alerts
  - name: vimbai.system
    rules:
      - alert: HighCPUUsage
        expr: |
          vimbai_cpu_usage_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.service }}"
          description: "CPU usage is {{ $value }}%"

      - alert: HighMemoryUsage
        expr: |
          vimbai_memory_usage_bytes / (vimbai_memory_usage_bytes + (1 - vimbai_memory_usage_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.service }}"
          description: "Memory usage exceeds 90%"

      - alert: DiskSpaceLow
        expr: |
          vimbai_disk_usage_percent > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on service {{ $labels.service }}"
          description: "Disk usage is {{ $value }}%"

  # Business Metrics Alerts
  - name: vimbai.business
    rules:
      - alert: HighTransactionFailureRate
        expr: |
          sum(rate(vimbai_transactions_total{status="failed"}[5m])) by (service, type)
          / sum(rate(vimbai_transactions_total[5m])) by (service, type) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High transaction failure rate"
          description: "{{ $labels.type }} transactions failing at {{ $value | humanizePercentage }}"

      - alert: NoJournalEntries
        expr: |
          increase(vimbai_journal_entries_total[1h]) == 0
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "No journal entries created"
          description: "No journal entries have been created in the last 2 hours"

  # Health Status Alerts
  - name: vimbai.health
    rules:
      - alert: ServiceUnhealthy
        expr: |
          vimbai_service_health == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is unhealthy"
          description: "Service health check has been failing"

      - alert: DatabaseUnhealthy
        expr: |
          vimbai_database_health == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database for {{ $labels.service }} is unhealthy"
          description: "Database health check has been failing"