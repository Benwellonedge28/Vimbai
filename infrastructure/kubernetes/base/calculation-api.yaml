# The Rust calculation API.
#
# Two reasons this exists. The calculators that already answer here are cheaper and faster than
# the Python services they replace, and the record endpoints (absorption costing, job costing)
# need the same service: they read and write a Book's records through vimbai_store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculation-api
  namespace: vimbai
  labels:
    app: calculation-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculation-api
  template:
    metadata:
      labels:
        app: calculation-api
        tier: backend
    spec:
      containers:
      - name: calculation-api
        image: ghcr.io/benwellonedge28/vimbai/calculation-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8099
          name: http
        env:
        - name: VIMBAI_API_ADDR
          value: "0.0.0.0:8099"
        - name: VIMBAI_POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: VIMBAI_POSTGRES_URL

---
apiVersion: v1
kind: Service
metadata:
  name: calculation-api
  namespace: vimbai
  labels:
    app: calculation-api
spec:
  selector:
    app: calculation-api
  ports:
  - port: 8099
    targetPort: 8099
    name: http
