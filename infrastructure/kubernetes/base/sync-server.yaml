# The sync server: the Book surface alone, so devices can be served at the rate devices arrive rather than at the rate
# books are written to. It refuses everything it does not serve, including a journal post.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-server
  labels:
    app: sync-server
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sync-server
  template:
    metadata:
      labels:
        app: sync-server
        tier: backend
    spec:
      serviceAccountName: vimbai-sa
      containers:
        - name: sync-server
          image: ghcr.io/benwellonedge28/vimbai/sync:latest
          ports:
            - name: http
              containerPort: 8099
          env:
            - name: VIMBAI_SYNC_ADDR
              value: "0.0.0.0:8099"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vimbai-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: sync-server
  labels:
    app: sync-server
spec:
  selector:
    app: sync-server
  ports:
    - name: http
      port: 8099
      targetPort: http
