# Vimbai Kubernetes Configuration
# Production-ready Kubernetes manifests for all microservices

---
# Namespace for Vimbai services
apiVersion: v1
kind: Namespace
metadata:
  name: vimbai
  labels:
    name: vimbai
    environment: production

---
---
# Secret for sensitive configuration (use sealed-secrets or vault in production). VIMBAI_POSTGRES_URL is the
# deployment store: ADR-007 makes PostgreSQL the system of record, so the DSN is what an operator supplies.
apiVersion: v1
kind: Secret
metadata:
  name: vimbai-secrets
  namespace: vimbai
type: Opaque
stringData:
  VIMBAI_POSTGRES_URL: "postgres://vimbai:CHANGE_ME_IN_PRODUCTION@postgres:5432/vimbai"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
  GITHUB_CLIENT_ID: "YOUR_GITHUB_CLIENT_ID"
  GITHUB_CLIENT_SECRET: "YOUR_GITHUB_CLIENT_SECRET"