# The worker: the schedules. It serves no port, so it has no probe and no Service - a pod that does nothing but wake up
# and run what is due. One replica, because two would race for the same claim (the claim is safe, but there is no reason
# to pay for the race).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
    tier: backend
spec:
  replicas: 1
  # a rolling update would briefly run two workers; Recreate keeps it to one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        tier: backend
    spec:
      serviceAccountName: vimbai-sa
      containers:
        - name: worker
          image: ghcr.io/benwellonedge28/vimbai/worker:latest
          env:
            - name: VIMBAI_WORKER_INTERVAL_SECONDS
              value: "30"
            - name: NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: vimbai-config
                  key: NEO4J_URI
            - name: NEO4J_USER
              valueFrom:
                configMapKeyRef:
                  name: vimbai-config
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vimbai-secrets
                  key: neo4j-password
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
