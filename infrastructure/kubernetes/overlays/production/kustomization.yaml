# Production: the base, with what production is willing to pay for and the protections it is not willing to go without.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vimbai

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: calculation-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: sync-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

configMapGenerator:
  - name: vimbai-config
    behavior: merge
    literals:
      - LOG_LEVEL=WARN
