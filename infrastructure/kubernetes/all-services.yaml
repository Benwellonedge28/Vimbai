apiVersion: apps/v1
kind: Deployment
metadata:
  name: npo-service
  namespace: vimbai
  labels:
    app: npo-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: npo-service
  template:
    metadata:
      labels:
        app: npo-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8446"
    spec:
      containers:
      - name: npo-service
        image: ghcr.io/benwellonedge28/vimbai/npo-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8446
          name: http
        env:
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: vimbai-config
              key: NEO4J_URI
        - name: NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: vimbai-config
              key: NEO4J_USER
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: NEO4J_PASSWORD
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_SERVICE_NAMESPACE
          value: vimbai
        - name: DEPLOYMENT_ENV
          value: production
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: JWT_SECRET
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: RABBITMQ_PASS
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8446
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8446
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: npo-service
  namespace: vimbai
  labels:
    app: npo-service
spec:
  selector:
    app: npo-service
  ports:
  - name: http
    port: 8446
    targetPort: 8446
