# Vimbai Microservices - Full Stack Docker Compose
# Generated from service inventory. 330+ Python services + Go API Gateway.
# Usage: docker compose up -d (or docker compose up <service_name>)
# Health checks: docker compose ps

version: "3.9"

services:
  # ============================================================
  # Infrastructure
  # ============================================================
  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/dev-password
    volumes:
      - neo4j-data:/data
    networks:
      - vimbai-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vimbai-net

  # ============================================================
  # API Gateway (Go)
  # ============================================================
  api_gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - IDENTITY_SERVICE_URL=http://identity_service:8080
      - ACCOUNTING_SERVICE_URL=http://accounting_service:8000
      - FINANCE_SERVICE_URL=http://finance_service:8001
      - MULTIMODAL_SERVICE_URL=http://multimodal_pipeline_service:8002
      - BANKING_INTEGRATION_SERVICE_URL=http://banking_integration_service:8003
      - SUPPLY_CHAIN_SERVICE_URL=http://supply_chain_service:8004
      - FRAUD_DETECTION_SERVICE_URL=http://fraud_detection_service:8005
    restart: unless-stopped
    depends_on:
      - neo4j
    networks:
      - vimbai-net

  # ============================================================
  # Core Services
  # ============================================================
  identity_service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dev-password
    restart: unless-stopped
    depends_on:
      - neo4j
    networks:
      - vimbai-net

  accounting_service:
    build:
      context: ./accounting-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dev-password
    restart: unless-stopped
    depends_on:
      - neo4j
    networks:
      - vimbai-net

  finance_service:
    build:
      context: ./finance-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
    restart: unless-stopped
    networks:
      - vimbai-net

  multimodal_pipeline_service:
    build:
      context: ./multimodal-pipeline-service
