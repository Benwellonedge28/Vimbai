version: '3.8'

services:
  neo4j:
    image: neo4j:4.4
    hostname: neo4j
    ports:
      - "7474:7474" # HTTP port for browser and API
      - "7687:7687" # Bolt port (for clients)
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j}
      - NEO4J_dbms_memory_heap_max__size=512M
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    # ports: # No longer expose directly if accessed via gateway
    #   - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
      - JWT_SECRET=your_super_secret_jwt_key # IMPORTANT: Change this in production or use .env file
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure

  accounting-service:
    build:
      context: ./accounting-service
      dockerfile: Dockerfile
    # ports: # No longer expose directly if accessed via gateway
    #   - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
      - JWT_SECRET=your_super_secret_jwt_key # IMPORTANT: Must match Identity Service's JWT_SECRET
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure

  finance-service:
    build:
      context: ./finance-service
      dockerfile: Dockerfile
    # ports: # No longer expose directly if accessed via gateway
    #   - "8001:8001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
      - JWT_SECRET=your_super_secret_jwt_key # IMPORTANT: Must match Identity Service's JWT_SECRET
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure

  multimodal-pipeline-service:
    build:
      context: ./multimodal-pipeline-service
      dockerfile: Dockerfile
    # ports: # No longer expose directly if accessed via gateway
    #   - "8002:8002"
    environment:
      - JWT_SECRET=your_super_secret_jwt_key # IMPORTANT: Must match Identity Service's JWT_SECRET
    depends_on:
      identity-service:
        condition: service_started
    restart: on-failure

  api-gateway: # NEW SERVICE
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081" # Expose gateway port to host
    environment:
      - PORT=8081
      - JWT_SECRET=your_super_secret_jwt_key # IMPORTANT: Must match across all services
      - IDENTITY_SERVICE_URL=http://identity-service:8080 # Internal Docker network names
      - ACCOUNTING_SERVICE_URL=http://accounting-service:8000
      - FINANCE_SERVICE_URL=http://finance-service:8001
      - MULTIMODAL_SERVICE_URL=http://multimodal-pipeline-service:8002
    depends_on:
      identity-service:
        condition: service_started
      accounting-service:
        condition: service_started
      finance-service:
        condition: service_started
      multimodal-pipeline-service:
        condition: service_started
    restart: on-failure
