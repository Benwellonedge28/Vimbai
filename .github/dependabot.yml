version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Go modules are in specific directories
  - package-ecosystem: "gomod"
    directory: "/gateway/go"
    schedule:
      interval: "weekly"
  
  - package-ecosystem: "gomod"
    directory: "/identity-service"
    schedule:
      interval: "weekly"

  # Dockerfiles are in specific directories
  - package-ecosystem: "docker"
    directory: "/gateway/go"
    schedule:
      interval: "weekly"
  
  - package-ecosystem: "docker"
    directory: "/identity-service"
    schedule:
      interval: "weekly"

  # The React frontend is retired (Flutter is the only UI), so its Dockerfile is no longer tracked
  # for updates. Its files stay in the tree as legacy until the screens are migrated.
