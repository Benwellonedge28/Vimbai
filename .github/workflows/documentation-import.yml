
name: Documentation Import

on:
  workflow_dispatch:
    inputs:
      documents:
        description: "Documentation package (JSON)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import documentation
        env:
          DOCUMENTS: ${{ inputs.documents }}
        run: |
          set -euo pipefail

          if ! jq -e 'type == "object" and length > 0' >/dev/null <<<"$DOCUMENTS"; then
            echo "Expected a non-empty document mapping" >&2
            exit 1
          fi

          root="$(pwd -P)"
          imported=0

          while IFS= read -r name; do
            case "$name" in
              docs/*.md) ;;
              *)
                echo "Invalid document: $name - it must be a .md file under docs/" >&2
                exit 1
                ;;
            esac
            case "/$name/" in
              */../*)
                echo "Unsafe path: $name" >&2
                exit 1
                ;;
            esac
            case "$name" in
              /*)
                echo "Unsafe path: $name" >&2
                exit 1
                ;;
            esac

            target="$root/$name"
            mkdir -p "$(dirname "$target")"
            jq -j --arg name "$name" '.[$name]' <<<"$DOCUMENTS" >"$target"
            imported=$((imported + 1))
          done < <(jq -r 'keys[]' <<<"$DOCUMENTS")

          echo "Imported $imported documents"

      - name: Commit documentation
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "Documentation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- docs/

          if git diff --cached --quiet; then
            echo "No documentation changes"
            exit 0
          fi

          BRANCH="docs/import-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$BRANCH"
          git commit -m "docs: import design documentation"
          git push origin "$BRANCH"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "Update design documentation" \
            --body "Documentation imported for review."
