name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Staging Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core service images
        run: |
          SERVICES=(
            "api-gateway"
            "identity-service"
            "accounting-service"
            "finance-service"
            "multimodal-pipeline-service"
            "banking-integration-service"
            "supply-chain-service"
            "fraud-detection-service"
            "workflow-service"
            "reporting-service"
          )
          for SERVICE in "${SERVICES[@]}"; do
            if [ -f "${SERVICE}/Dockerfile" ]; then
              echo "Building ${SERVICE}..."
              docker buildx build \
                --platform linux/amd64 \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${SERVICE}:staging \
                --push \
                "./${SERVICE}"
            fi
          done

  deploy-staging:
    name: Deploy to Staging Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.vimbai.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to Staging Cluster
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -k k8s/
          kubectl rollout restart deployment -n vimbai api-gateway
          kubectl rollout restart deployment -n vimbai identity-service
          kubectl rollout restart deployment -n vimbai accounting-service
          kubectl rollout status deployment -n vimbai api-gateway --timeout=300s
          kubectl rollout status deployment -n vimbai identity-service --timeout=300s
          kubectl rollout status deployment -n vimbai accounting-service --timeout=300s
