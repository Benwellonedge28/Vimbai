name: Flutter Analyze

on:
  push:
    branches: [main]
    paths:
      - "apps/flutter/**"
      - ".github/workflows/mobile-analyze.yml"
  pull_request:
    paths:
      - "apps/flutter/**"

concurrency:
  group: mobile-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          # the same version the core pipeline gates on and the app is developed against, so a green here and a green
          # there mean the same thing
          version: 3.50.0
          cache: true
          cache-sdk: true

      - name: Pub get
        run: flutter pub get
        working-directory: apps/flutter

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/flutter

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
        working-directory: apps/flutter

      # The app's own tests. They answer through a replaced transport, so they need no server and no emulator: what they
      # hold is the offline rules - which requests are retried, what a dead network becomes - and the shape of what the
      # engine sends and the app writes back.
      - name: Test the app
        run: flutter test
        working-directory: apps/flutter
