name: Infrastructure as Code Validation

on:
  push:
    paths:
      - 'infrastructure/**'
      - 'charts/**'
      - 'k8s/**'
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'charts/**'
      - 'k8s/**'

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform Format Check
        run: |
          if [ -d "infrastructure" ]; then
            terraform fmt -check -recursive infrastructure/ || true
          else
            echo "No infrastructure/ directory found, skipping Terraform validation"
          fi

  validate-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Helm Lint
        run: |
          if [ -d "k8s/helm" ]; then
            helm lint k8s/helm/vimbai || helm lint k8s/helm || true
          else
            echo "No Helm chart found, skipping"
          fi
