name: Infrastructure as Code Validation

on:
  push:
    paths:
      - 'infrastructure/**'
  pull_request:
    paths:
      - 'infrastructure/**'

jobs:
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Format Check
        run: |
          if [ -d "infrastructure" ]; then
            terraform fmt -check -recursive infrastructure/ || true
          else
            echo "No infrastructure/ directory found, skipping Terraform validation"
          fi

  validate-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kustomize renders base and every overlay
        run: |
          for tree in infrastructure/kubernetes/base infrastructure/kubernetes/overlays/*; do
            echo "== ${tree}"
            kubectl kustomize "${tree}" > /dev/null
          done

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every compose variant is valid, on its own and on top of the base
        run: |
          base=infrastructure/compose/compose.yaml
          docker compose -f "${base}" config -q
          for variant in infrastructure/compose/compose.dev.yaml \
                         infrastructure/compose/compose.test.yaml \
                         infrastructure/compose/compose.observability.yaml; do
            echo "== ${variant}"
            docker compose -f "${base}" -f "${variant}" config -q
          done
