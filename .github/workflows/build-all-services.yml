name: Build All Service Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch number (1-7, 0 for all)'
        required: false
        default: '0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare Service List
    runs-on: ubuntu-latest
    outputs:
      services_batch1: ${{ steps.list.outputs.batch1 }}
      services_batch2: ${{ steps.list.outputs.batch2 }}
      services_batch3: ${{ steps.list.outputs.batch3 }}
      services_batch4: ${{ steps.list.outputs.batch4 }}
      services_batch5: ${{ steps.list.outputs.batch5 }}
      services_batch6: ${{ steps.list.outputs.batch6 }}
      services_batch7: ${{ steps.list.outputs.batch7 }}
      total: ${{ steps.list.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate service list and batch
        id: list
        run: |
          # Find all directories with a Dockerfile (excluding .git, node_modules, docs)
          SERVICES=$(find . -name "Dockerfile" -not -path "./.git/*" -not -path "./node_modules/*" -exec dirname {} \; | sed 's|^\./||' | sort -u)
          
          TOTAL=$(echo "$SERVICES" | wc -l)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Found $TOTAL services with Dockerfiles"
          
          # Split into 7 batches of ~48 each
          BATCH_SIZE=48
          for i in 1 2 3 4 5 6 7; do
            START=$(( (i - 1) * BATCH_SIZE + 1 ))
            BATCH=$(echo "$SERVICES" | sed -n "${START},$(( START + BATCH_SIZE - 1 ))p" | jq -R . | jq -s .)
            echo "batch${i}=$BATCH" >> $GITHUB_OUTPUT
            COUNT=$(echo "$BATCH" | jq length)
            echo "Batch $i: $COUNT services"
          done

  build-batch-1:
    name: Build Batch 1
    needs: prepare
    if: github.event.inputs.batch == '0' || github.event.inputs.batch == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services_batch1) }}
      fail-fast: false
      max-parallel: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-batch-2:
