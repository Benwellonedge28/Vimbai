name: Calculation Library CI

on:
  push:
    branches: [main]
    paths:
      - "library/**"
      - ".github/workflows/library-ci.yml"
  pull_request:
    paths:
      - "library/**"
      - ".github/workflows/library-ci.yml"

jobs:
  test:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify safe Rust only (no unsafe blocks)
        run: |
          # native/ is the one deliberate exception: PyO3 needs unsafe to cross
          # the interpreter boundary, and it holds no financial logic.
          ! grep -rnE 'unsafe(\s*\{|\s+(fn|impl|trait|extern))' library --include="*.rs" --exclude-dir=native

      - name: Formatting
        run: cargo fmt --all -- --check
        working-directory: library

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: library

      - name: Tests
        run: cargo test --workspace
        working-directory: library

  seam:
    name: Python seam (maturin build, parity tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install the extension
        run: |
          python -m pip install --upgrade pip maturin pytest fastapi httpx pydantic structlog neo4j
          maturin build --release -o dist
          pip install dist/*.whl
        working-directory: library/native

      - name: Seam unit tests
        run: cargo test
        working-directory: library/native

      - name: Parity with the Python services
        run: python -m pytest tests/test_native_seam.py -q
