name: Calculation Library CI

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/library-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/library-ci.yml"

jobs:
  test:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    # The deployment-store tests answer against Postgres or they skip. A skip reads like a pass, so the pipeline starts the
    # server the same way preflight does on a laptop, and names it in the variable the tests look for.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify safe Rust only (no unsafe blocks)
        run: |
          # There is no exception any more. The PyO3 extension that needed unsafe to cross
          # the interpreter boundary is gone, so every crate is held to this.
          ! grep -rnE 'unsafe(\s*\{|\s+(fn|impl|trait|extern))' rust --include="*.rs"

      - name: Formatting
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust

      # Two test files start a real binary, so CI builds them first: without this they skip, and a skip is not a test.
      - name: Build the binaries their tests start
        run: cargo build -p vimbai_local -p vimbai_sync
        working-directory: rust

      - name: Tests
        run: cargo test --workspace
        working-directory: rust
        env:
          VIMBAI_LOCAL_BIN: ${{ github.workspace }}/rust/target/debug/vimbai-local
          VIMBAI_SYNC_BIN: ${{ github.workspace }}/rust/target/debug/vimbai-sync
          VIMBAI_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres

