name: Calculation Library CI

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/library-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/library-ci.yml"

jobs:
  test:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify safe Rust only (no unsafe blocks)
        run: |
          # There is no exception any more. The PyO3 extension that needed unsafe to cross
          # the interpreter boundary is gone, so every crate is held to this.
          ! grep -rnE 'unsafe(\s*\{|\s+(fn|impl|trait|extern))' rust --include="*.rs"

      - name: Formatting
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust

      - name: Tests
        run: cargo test --workspace
        working-directory: rust

