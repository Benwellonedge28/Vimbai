name: Registry Cleanup

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      keep_last:
        description: 'Number of recent versions to keep per service'
        required: false
        default: '10'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cleanup:
    name: Prune Old Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get all service directories
        id: services
        run: |
          SERVICES=$(find . -name "Dockerfile" -not -path "./.git/*" -exec dirname {} \; | sed 's|^\./||' | sort -u)
          echo "services<<EOF" >> $GITHUB_OUTPUT
          echo "$SERVICES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          COUNT=$(echo "$SERVICES" | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Prune old images via GitHub Packages API
        id: prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_LAST: ${{ github.event.inputs.keep_last || '10' }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # GHCR container package names for this repo are "<repo>/<service>",
          # lower-cased, and the slash must be URL-encoded (%2F) in the API path.
          # We use the /user/packages endpoints (GITHUB_TOKEN is the repo-linked
          # user token). 404 = package not published yet -> skip, not fail.
          TOTAL_PRUNED=0

          for SERVICE in ${{ steps.services.outputs.services }}; do
            PACKAGE="$(printf '%s/%s' "$REPO_NAME" "$SERVICE" | tr '[:upper:]' '[:lower:]' | sed 's|/|%2F|')"
            echo "Processing $SERVICE (package: $PACKAGE)..."

            RESPONSE=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/$PACKAGE/versions?per_page=100")

            # A missing package returns {"message":"Not Found",...} - an object,
            # not an array. Only proceed when jq gives us a list.
            if ! echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "  No package found (or not visible), skipping"
              continue
            fi

            VERSION_COUNT=$(echo "$RESPONSE" | jq 'length')
            if [ "$VERSION_COUNT" -le "$KEEP_LAST" ]; then
              echo "  Found $VERSION_COUNT versions, under threshold ($KEEP_LAST), nothing to do"
              continue
            fi

            echo "  Found $VERSION_COUNT versions, pruning all but the newest $KEEP_LAST"
            TO_DELETE=$(echo "$RESPONSE" | jq -r ".[$KEEP_LAST:] | .[].id")

            DELETED=0
            for VERSION_ID in $TO_DELETE; do
              [ -z "$VERSION_ID" ] && continue
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/container/$PACKAGE/versions/$VERSION_ID")
              if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
                DELETED=$((DELETED + 1))
              else
                echo "  Warning: failed to delete version $VERSION_ID (HTTP $HTTP_CODE)"
              fi
            done

            echo "  Deleted $DELETED old versions"
            TOTAL_PRUNED=$((TOTAL_PRUNED + DELETED))
          done

          echo "TOTAL_PRUNED=$TOTAL_PRUNED" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Registry cleanup complete."
          echo "Services scanned: ${{ steps.services.outputs.count }}"
          echo "Keep last: ${{ github.event.inputs.keep_last || '10' }} versions per service"
          echo "Old versions pruned: ${{ steps.prune.outputs.TOTAL_PRUNED || '0' }}"
