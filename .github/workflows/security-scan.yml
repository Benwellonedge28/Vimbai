name: Comprehensive Security Scan

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve scan base
        id: base
        run: |
          # On a push the event carries the previous commit. On a schedule or a
          # manual dispatch there is no event base, and asking TruffleHog to
          # compare a branch with itself aborts the scan, so fall back to the
          # previous commit and, failing that, scan the filesystem.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || [ "$base" = "${{ github.sha }}" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "scanning from '${base:-the filesystem}' to HEAD"
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.base.outputs.base }}
          head: HEAD
          extra_args: --only-verified

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: TRIVY-SECURITY-SCAN
        continue-on-error: true

  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: vimbai-sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: vimbai-sbom.spdx.json
