name: Comprehensive Security Scan

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Resolve scan base
        id: base
        run: |
          # On a push the event carries the previous commit. On a schedule or a
          # manual dispatch there is no event base, and asking TruffleHog to
          # compare a branch with itself aborts the scan, so fall back to the
          # previous commit and, failing that, scan the filesystem.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || [ "$base" = "${{ github.sha }}" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "scanning from '${base:-the filesystem}' to HEAD"
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@23255461ddf3958c4d949d89925b03eaf263d838
        with:
          path: ./
          base: ${{ steps.base.outputs.base }}
          head: HEAD
          extra_args: --only-verified

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6
        with:
          sarif_file: 'trivy-results.sarif'
          category: TRIVY-SECURITY-SCAN
        continue-on-error: true

  # The Rust engine ships a lock file; `cargo audit` reads it against the advisory database. This is the check that used to
  # live in the all-in-one `ci.yml`, where every job carried `continue-on-error` and the workflow could not even compile.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-audit
      - name: Audit the dependencies the engine ships
        working-directory: rust
        run: cargo audit --json > cargo-audit-report.json || (cat cargo-audit-report.json; exit 1)
      - name: Upload the audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cargo-audit-report
          path: rust/cargo-audit-report.json
          retention-days: 30

  # CodeQL for the gateway, which is the one language here that CodeQL understands. It used to run in `ci.yml` over
  # `python, javascript, typescript` - two languages this repository no longer has and one it only has as a legacy tree.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6
        with:
          languages: go
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6
        with:
          category: "/language:go"

  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          format: spdx-json
          output-file: vimbai-sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: vimbai-sbom.spdx.json
