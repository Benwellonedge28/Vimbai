name: Platform Integration Tests

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '**/*.py'
      - '**/Dockerfile'
      - 'tests/**'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '**/*.py'
      - '**/Dockerfile'
      - 'tests/**'
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-integration-tests:
    name: Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx fastapi pydantic structlog uvicorn pytest-cov coverage

      - name: Run integration test suite with coverage
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short \
            --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing \
            --ignore=tests/test_accounting_service.py \
            --ignore=tests/test_alerts_service.py \
            --ignore=tests/test_api_gateway.py \
            --ignore=tests/test_banking_service.py \
            --ignore=tests/test_notifications_service.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            tests/
            coverage.xml
          retention-days: 14
