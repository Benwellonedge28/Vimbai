name: Deploy to Production

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core service images
        run: |
          SERVICES=(
            "api-gateway"
            "identity-service"
            "accounting-service"
            "finance-service"
            "multimodal-pipeline-service"
            "banking-integration-service"
            "supply-chain-service"
            "fraud-detection-service"
            "workflow-service"
            "reporting-service"
            "automation-engine-service"
            "alerts-service"
            "notifications-service"
          )
          for SERVICE in "${SERVICES[@]}"; do
            if [ -f "${SERVICE}/Dockerfile" ]; then
              echo "Building ${SERVICE}..."
              docker buildx build \
                --platform linux/amd64 \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${SERVICE}:${{ github.ref_name }} \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${SERVICE}:latest \
                --push \
                "./${SERVICE}"
            fi
          done

      - name: Build and push web frontend
        run: |
          if [ -f "web-frontend/Dockerfile" ]; then
            docker buildx build \
              --platform linux/amd64 \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web-frontend:${{ github.ref_name }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web-frontend:latest \
              --push \
              "./web-frontend"
          fi

  deploy-production:
    name: Deploy to Production Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for kubeconfig
        id: check
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
            echo "No KUBE_CONFIG_PRODUCTION secret found, skipping deployment"
          else
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes context
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy to Production Cluster
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -k k8s/
          kubectl rollout restart deployment -n vimbai api-gateway
          kubectl rollout restart deployment -n vimbai identity-service
          kubectl rollout restart deployment -n vimbai accounting-service
          kubectl rollout status deployment -n vimbai api-gateway --timeout=300s
          kubectl rollout status deployment -n vimbai identity-service --timeout=300s
          kubectl rollout status deployment -n vimbai accounting-service --timeout=300s

      - name: Verify deployment health
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          kubectl get pods -n vimbai -o wide
          kubectl get services -n vimbai
          kubectl get ingress -n vimbai

      - name: Skip notification
        if: steps.check.outputs.has_kubeconfig == 'false'
        run: echo "Deployment skipped - no kubeconfig configured"
