name: Deploy to Production

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: benwellonedge28/vimbai

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core service images
        run: |
          SERVICES=(
            "api-gateway"
            ""
            "alerts-service"
          )
          # The gateway's source lives at gateway/go, but its image and deployment are
          # still named api-gateway: renaming those is a production change, not a
          # repository tidy-up.
          for SERVICE in "${SERVICES[@]}"; do
            DIR="${SERVICE}"
            if [ "${SERVICE}" = "api-gateway" ]; then DIR="gateway/go"; fi
            if [ -f "${DIR}/Dockerfile" ]; then
              echo "Building ${SERVICE} from ${DIR}..."
              docker buildx build \
                --platform linux/amd64 \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${SERVICE}:${{ github.ref_name }} \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${SERVICE}:latest \
                --push \
                "./${DIR}"
            fi
          done

      - name: Check for kubeconfig
        id: check
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
            echo "No KUBE_CONFIG_PRODUCTION secret found, skipping deployment"
          else
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e

      - name: Configure Kubernetes context
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/k8s-set-context@5f008dfddbbc9df61ba40a7aaa912c6033ba62fc
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy to Production Cluster
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          # applies the overlay and restarts every Deployment in it, not just the gateway: the images carry :latest, so an
          # apply on its own starts no rollout and the cluster keeps serving the previous release
          ./scripts/deploy.sh production

      - name: Verify deployment health
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          kubectl get pods -n vimbai -o wide
          kubectl get services -n vimbai
          kubectl get ingress -n vimbai

      - name: Skip notification
        if: steps.check.outputs.has_kubeconfig == 'false'
        run: echo "Deployment skipped - no kubeconfig configured"
