name: Deploy to Production

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: benwellonedge28/vimbai

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core service images
        run: |
          SERVICES=(
            "api-gateway"
            ""
            "alerts-service"
          )
          # The gateway's source lives at gateway/go, but its image and deployment are
          # still named api-gateway: renaming those is a production change, not a
          # repository tidy-up.
          for SERVICE in "${SERVICES[@]}"; do
            DIR="${SERVICE}"
            if [ "${SERVICE}" = "api-gateway" ]; then DIR="gateway/go"; fi
            if [ -f "${DIR}/Dockerfile" ]; then
              echo "Building ${SERVICE} from ${DIR}..."
              docker buildx build \
                --platform linux/amd64 \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${SERVICE}:${{ github.ref_name }} \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${SERVICE}:latest \
                --push \
                "./${DIR}"
            fi
          done

      - name: Check for kubeconfig
        id: check
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
            echo "No KUBE_CONFIG_PRODUCTION secret found, skipping deployment"
          else
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes context
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy to Production Cluster
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          kubectl apply -k infrastructure/kubernetes/
          kubectl rollout restart deployment -n vimbai api-gateway
          kubectl rollout status deployment -n vimbai api-gateway --timeout=300s

      - name: Verify deployment health
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          kubectl get pods -n vimbai -o wide
          kubectl get services -n vimbai
          kubectl get ingress -n vimbai

      - name: Skip notification
        if: steps.check.outputs.has_kubeconfig == 'false'
        run: echo "Deployment skipped - no kubeconfig configured"
