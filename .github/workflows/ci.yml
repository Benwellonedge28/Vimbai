name: Vimbai Production CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/package.json'
      - '**/Dockerfile'
      - 'gateway/go/**'
      - 'shared/**'
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/package.json'
      - '**/Dockerfile'
      - 'gateway/go/**'
      - 'shared/**'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: benwellonedge28/vimbai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ============================================================
  # Code Quality - Linting
  # ============================================================
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript, typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript,typescript"
          upload: always
        continue-on-error: true

  # ============================================================
  # Python Services - Unit Tests
  # ============================================================
  build-go:
    name: Build Go API Gateway
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: gateway/go/go.sum

      - name: Download dependencies
        working-directory: gateway/go
        run: go mod download

      - name: Verify Go dependencies
        working-directory: gateway/go
        run: go mod verify

      - name: Build API Gateway
        working-directory: gateway/go
        run: go build -v -o vimbai-gateway .

      - name: Verify binary exists
        run: |
          ls -la gateway/go/vimbai-gateway
          file gateway/go/vimbai-gateway

      - name: Run Go tests
        working-directory: gateway/go
        run: go test -v -race ./... || echo "No Go tests found"

      - name: Run Go vet
        working-directory: gateway/go
        run: go vet ./...

  # ============================================================

  # ============================================================
  # Docker Build - Core Services (not all 342)
  # ============================================================
  docker-build:
    name: Build Core Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, test-python-services, build-go]
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build core service images
        run: |
          CORE_SERVICES=(
            "api-gateway"
          )
          # gateway/go holds the gateway's source; its image stays api-gateway.
          for SERVICE in "${CORE_SERVICES[@]}"; do
            DIR="${SERVICE}"
            if [ "${SERVICE}" = "api-gateway" ]; then DIR="gateway/go"; fi
            if [ -f "${DIR}/Dockerfile" ]; then
              echo "Building ${SERVICE} from ${DIR}..."
              docker buildx build \
                --platform linux/amd64 \
                -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}:${{ github.sha }} \
                -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}:latest \
                --push \
                "./${DIR}"
            fi
          done

      - name: Validate Docker Compose
        run: docker compose config --services | head -20

  # ============================================================
  # Deploy to Kubernetes (only if KUBECONFIG secret exists)
  # ============================================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for kubeconfig
        id: check
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
            echo "No KUBECONFIG secret found, skipping deployment"
          else
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure kubectl
        if: steps.check.outputs.has_kubeconfig == 'true'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to Kubernetes
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          export KUBECONFIG=$(pwd)/kubeconfig
          # kustomize is the one deployment story: base plus the environment overlay
          kubectl apply -k infrastructure/kubernetes/overlays/production
          kubectl rollout status deployment/calculation-api -n vimbai --timeout=10m

  # ============================================================
  # Security Scans (non-blocking)
  # ============================================================
  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        run: |
          mkdir -p zap-reports
          docker run -t owasp/zap2docker-stable:latest zap-baseline.py \
            -t https://www.example.com \
            -J zap-baseline-report.json \
            -w zap-baseline-report.md \
            -r zap-baseline-report.html \
            || true
        continue-on-error: true

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-*.json
          retention-days: 30
        if: always()

  dependency-vulnerabilities:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # There is no Python left to audit. cargo-audit reads the lock file the engine actually ships, and the security
      # workflow already runs it; a second reader of the same lock file would be a duplicate, not a second opinion.
      - name: Audit the Rust dependencies
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --json > cargo-audit-report.json || true
        continue-on-error: true

      - name: Upload the audit report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: cargo-audit-report.json
          retention-days: 30
        if: always()

  trivy-scan:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan filesystem for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: TRIVY-FS
        continue-on-error: true

  grype-scan:
    name: Grype Vulnerability Scanner
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Grype vulnerability scan
        uses: anchore/scan-action@v7
        with:
          path: '.'
          output-format: sarif
          output-file: 'grype-results.sarif'
          severity-cutoff: medium
          fail-build: false
        continue-on-error: true

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'grype-results.sarif'
          category: GRYPE
        continue-on-error: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30
        if: always()

  # ============================================================
  # ============================================================
  # Notification on Failure
  # ============================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-python, test-python-services, build-go, docker-build, codeql-analysis, zap-scan, grype-scan, trivy-scan, dependency-vulnerabilities, sbom]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Pipeline results:"
          echo "  lint-python: ${{ needs.lint-python.result }}"
          echo "  test-python-services: ${{ needs.test-python-services.result }}"
          echo "  build-go: ${{ needs.build-go.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          echo "  codeql-analysis: ${{ needs.codeql-analysis.result }}"
          echo "  zap-scan: ${{ needs.zap-scan.result }}"
          echo "  grype-scan: ${{ needs.grype-scan.result }}"
          echo "  trivy-scan: ${{ needs.trivy-scan.result }}"
          echo "  dependency-vulnerabilities: ${{ needs.dependency-vulnerabilities.result }}"
          echo "  sbom: ${{ needs.sbom.result }}"
          
          # Only fail if critical jobs failed
          if [[ "${{ needs.lint-python.result }}" == "failure" || \
                "${{ needs.test-python-services.result }}" == "failure" || \
                "${{ needs.build-go.result }}" == "failure" ]]; then
            echo "::error::Critical CI checks failed"
            exit 1
          fi
          echo "All critical checks passed!"
