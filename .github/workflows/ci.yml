name: FinAcc Production CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.21'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Code Quality - Linting
  # ============================================================
  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black (format check)
        run: |
          black --check \
            accounting-service/ \
            finance-service/ \
            fraud-detection-service/ \
            banking-integration-service/ \
            invoicing-service/ \
            workflow-service/ \
            reporting-service/ \
            automation-engine-service/ \
            automation-engine/ \
            multimodal-pipeline-service/ \
            admin-service/ \
            alerts-service/ \
            cache-service/ \
            currency-service/ \
            graphql-service/ \
            message-bus-service/ \
            notifications-service/ \
            npo-service/ \
            scenario-modeling-service/ \
            supply-chain-service/ \
            pos-integration-service/ \
            document-service/ \
            bank-feed-service/ \
            payment-gateway-service/ \
            2>/dev/null || true

      - name: Run isort (import check)
        run: |
          isort --check-only \
            accounting-service/ \
            finance-service/ \
            fraud-detection-service/ \
            banking-integration-service/ \
            invoicing-service/ \
            workflow-service/ \
            reporting-service/ \
            automation-engine-service/ \
            automation-engine/ \
            multimodal-pipeline-service/ \
            admin-service/ \
            alerts-service/ \
            cache-service/ \
            currency-service/ \
            graphql-service/ \
            message-bus-service/ \
            notifications-service/ \
            npo-service/ \
            scenario-modeling-service/ \
            supply-chain-service/ \
            pos-integration-service/ \
            document-service/ \
            bank-feed-service/ \
            payment-gateway-service/ \
            2>/dev/null || true

      - name: Run flake8 (lint)
        run: |
          flake8 \
            accounting-service/ \
            finance-service/ \
            fraud-detection-service/ \
            banking-integration-service/ \
            invoicing-service/ \
            workflow-service/ \
            reporting-service/ \
            automation-engine-service/ \
            automation-engine/ \
            multimodal-pipeline-service/ \
            admin-service/ \
            alerts-service/ \
            cache-service/ \
            currency-service/ \
            graphql-service/ \
            message-bus-service/ \
            notifications-service/ \
            npo-service/ \
            scenario-modeling-service/ \
            supply-chain-service/ \
            pos-integration-service/ \
            document-service/ \
            bank-feed-service/ \
            payment-gateway-service/ \
            --max-line-length=120 --extend-ignore=E501,W503,E203 || true

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        working-directory: web-frontend
        run: yarn lint || true

  # ============================================================
  # Python Services - Unit Tests
  # ============================================================
  test-python-services:
    name: Test Python Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pytest-cov neo4j-driver fastapi uvicorn pydantic python-dotenv python-jose passlib bcrypt APScheduler structlog

      - name: Test accounting-service
        run: |
          cd accounting-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test finance-service
        run: |
          cd finance-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test fraud-detection-service
        run: |
          cd fraud-detection-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test banking-integration-service
        run: |
          cd banking-integration-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test invoicing-service
        run: |
          cd invoicing-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test workflow-service
        run: |
          cd workflow-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test reporting-service
        run: |
          cd reporting-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test automation-engine-service
        run: |
          cd automation-engine-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test automation-engine
        run: |
          cd automation-engine && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test multimodal-pipeline-service
        run: |
          cd multimodal-pipeline-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test admin-service
        run: |
          cd admin-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test alerts-service
        run: |
          cd alerts-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test cache-service
        run: |
          cd cache-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test currency-service
        run: |
          cd currency-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test message-bus-service
        run: |
          cd message-bus-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test notifications-service
        run: |
          cd notifications-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test npo-service
        run: |
          cd npo-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test scenario-modeling-service
        run: |
          cd scenario-modeling-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test supply-chain-service
        run: |
          cd supply-chain-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test pos-integration-service
        run: |
          cd pos-integration-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test document-service
        run: |
          cd document-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test bank-feed-service
        run: |
          cd bank-feed-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Test payment-gateway-service
        run: |
          cd payment-gateway-service && pip install -q -r requirements.txt 2>/dev/null || true
          pytest -v --cov=. --cov-report=xml --tb=short 2>/dev/null || echo "No tests found"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================================
  # Go API Gateway - Build & Test
  # ============================================================
  build-go:
    name: Build Go API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api-gateway/go.sum

      - name: Download dependencies
        working-directory: api-gateway
        run: go mod download

      - name: Build API Gateway
        working-directory: api-gateway
        run: go build -v -o finacc-gateway ./...

      - name: Run Go tests
        working-directory: api-gateway
        run: go test -v -race ./... 2>/dev/null || echo "No tests found"

      - name: Build Go Docker image
        working-directory: api-gateway
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }} .

  # ============================================================
  # React Frontend - Build
  # ============================================================
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: web-frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: web-frontend
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web-frontend/dist
          retention-days: 30

      - name: Build frontend Docker image
        working-directory: web-frontend
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/web-frontend:${{ github.sha }} .

  # ============================================================
  # Docker Build - Full Stack
  # ============================================================
  docker-build:
    name: Build All Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend, test-python-services, build-go, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all Docker images
        run: |
          docker compose build --parallel

      - name: Validate Docker Compose
        run: docker compose config --services

      - name: Push Docker images to registry
        run: |
          docker compose push
        continue-on-error: true

  # ============================================================
  # Kubernetes Deployment (Production)
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://finacc.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install finacc ./k8s/helm \
            --namespace finacc \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m
        continue-on-error: true

  # ============================================================
  # Security Scanning
  # ============================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run Grype vulnerability scanner
        uses: anchore/grype-action@main
        with:
          directory: '.'
          fail-on: 'none'
        continue-on-error: true

  # ============================================================
  # Generate SBOM
  # ============================================================
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM
        run: |
          # Generate SBOM for Go project
          if command -v syft &> /dev/null; then
            syft . -o spdx-json > sbom.spdx.json || true
          else
            echo "Syft not installed, skipping SBOM generation" || true
          fi
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
        continue-on-error: true

  # ============================================================
  # Notification on Failure
  # ============================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend, test-python-services, build-go, build-frontend, docker-build, security-scan, sbom]
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "FinAcc CI/CD Pipeline failed. Please check the logs for details."
        continue-on-error: true