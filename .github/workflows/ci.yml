name: Vimbai Production CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/package.json'
      - '**/Dockerfile'
      - 'api-gateway/**'
      - 'shared/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/package.json'
      - '**/Dockerfile'
      - 'api-gateway/**'
      - 'shared/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: benwellonedge28/vimbai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  # ============================================================
  # Code Quality - Linting
  # ============================================================
  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black (format check)
        run: |
          for dir in */; do
            if [ -f "${dir}main.py" ] && [ -f "${dir}requirements.txt" ]; then
              black --check "$dir" --quiet
            fi
          done

      - name: Run isort (import check)
        run: |
          for dir in */; do
            if [ -f "${dir}main.py" ] && [ -f "${dir}requirements.txt" ]; then
              isort --check-only "$dir" --quiet
            fi
          done

      - name: Run flake8 (lint)
        run: |
          flake8 . --quiet

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        working-directory: web-frontend
        run: yarn lint || echo "ESLint warnings - continuing"
        continue-on-error: true

  # ============================================================
  # CodeQL Analysis
  # ============================================================
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript, typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript,typescript"
          upload: always
        continue-on-error: true

  # ============================================================
  # Python Services - Unit Tests
  # ============================================================
  test-python-services:
    name: Test Python Services
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pytest-cov neo4j-driver fastapi uvicorn pydantic python-dotenv python-jose passlib bcrypt APScheduler structlog aiohttp

      - name: Run unified integration test suite with coverage
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short -q \
            --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing \
            --ignore=tests/test_accounting_service.py \
            --ignore=tests/test_alerts_service.py \
            --ignore=tests/test_api_gateway.py \
            --ignore=tests/test_banking_service.py \
            --ignore=tests/test_notifications_service.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: tests/
          retention-days: 14

  # ============================================================
  # Go API Gateway - Build & Test
  # ============================================================
  build-go:
    name: Build Go API Gateway
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api-gateway/go.sum

      - name: Download dependencies
        working-directory: api-gateway
        run: go mod download

      - name: Verify Go dependencies
        working-directory: api-gateway
        run: go mod verify

      - name: Build API Gateway
        working-directory: api-gateway
        run: go build -v -o vimbai-gateway .

      - name: Verify binary exists
        run: |
          ls -la api-gateway/vimbai-gateway
          file api-gateway/vimbai-gateway

      - name: Run Go tests
        working-directory: api-gateway
        run: go test -v -race ./... || echo "No Go tests found"

      - name: Run Go vet
        working-directory: api-gateway
        run: go vet ./...

  # ============================================================
  # React Frontend - Build
  # ============================================================
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: web-frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: web-frontend
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web-frontend/dist
          retention-days: 30

  # ============================================================
  # Docker Build - Core Services (not all 342)
  # ============================================================
  docker-build:
    name: Build Core Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, test-python-services, build-go, build-frontend]
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build core service images
        run: |
          CORE_SERVICES=(
            "api-gateway"
            "identity-service"
            "accounting-service"
            "finance-service"
            "web-frontend"
          )
          for SERVICE in "${CORE_SERVICES[@]}"; do
            if [ -f "${SERVICE}/Dockerfile" ]; then
              echo "Building ${SERVICE}..."
              docker buildx build \
                --platform linux/amd64 \
                -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}:${{ github.sha }} \
                -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SERVICE}:latest \
                --push \
                "./${SERVICE}"
            fi
          done

      - name: Validate Docker Compose
        run: docker compose config --services | head -20

  # ============================================================
  # Deploy to Kubernetes (only if KUBECONFIG secret exists)
  # ============================================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for kubeconfig
        id: check
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
            echo "No KUBECONFIG secret found, skipping deployment"
          else
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Helm
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        if: steps.check.outputs.has_kubeconfig == 'true'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to Kubernetes
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          export KUBECONFIG=$(pwd)/kubeconfig
          helm upgrade --install vimbai ./k8s/helm \
            --namespace vimbai \
            --create-namespace \
            --values k8s/helm/vimbai/values.yaml \
            --wait --timeout 10m

  # ============================================================
  # Security Scans (non-blocking)
  # ============================================================
  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        run: |
          mkdir -p zap-reports
          docker run -t owasp/zap2docker-stable:latest zap-baseline.py \
            -t https://www.example.com \
            -J zap-baseline-report.json \
            -w zap-baseline-report.md \
            -r zap-baseline-report.html \
            || true
        continue-on-error: true

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-*.json
          retention-days: 30
        if: always()

  dependency-vulnerabilities:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --format=json --output pip-audit-report.json || true
        continue-on-error: true

      - name: Upload pip-audit Report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30
        if: always()

  trivy-scan:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan filesystem for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: TRIVY-FS
        continue-on-error: true

  grype-scan:
    name: Grype Vulnerability Scanner
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Grype vulnerability scan
        uses: anchore/grype-action@main
        with:
          directory: '.'
          format: sarif
          output: 'grype-results.sarif'
          severity-cutoff: medium
          fail-build: false
        continue-on-error: true

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'grype-results.sarif'
          category: GRYPE
        continue-on-error: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30
        if: always()

  # ============================================================
  # NPM Audit (non-blocking)
  # ============================================================
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Run NPM audit
        working-directory: web-frontend
        run: |
          npm audit --json > npm-audit-report.json || true
        continue-on-error: true

      - name: Upload NPM audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: web-frontend/npm-audit-report.json
          retention-days: 30
        if: always()

  # ============================================================
  # Notification on Failure
  # ============================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-python, test-python-services, build-go, build-frontend, docker-build, codeql-analysis, zap-scan, grype-scan, trivy-scan, dependency-vulnerabilities, sbom, npm-audit]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Pipeline results:"
          echo "  lint-python: ${{ needs.lint-python.result }}"
          echo "  test-python-services: ${{ needs.test-python-services.result }}"
          echo "  build-go: ${{ needs.build-go.result }}"
          echo "  build-frontend: ${{ needs.build-frontend.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          echo "  codeql-analysis: ${{ needs.codeql-analysis.result }}"
          echo "  zap-scan: ${{ needs.zap-scan.result }}"
          echo "  grype-scan: ${{ needs.grype-scan.result }}"
          echo "  trivy-scan: ${{ needs.trivy-scan.result }}"
          echo "  dependency-vulnerabilities: ${{ needs.dependency-vulnerabilities.result }}"
          echo "  sbom: ${{ needs.sbom.result }}"
          echo "  npm-audit: ${{ needs.npm-audit.result }}"
          
          # Only fail if critical jobs failed
          if [[ "${{ needs.lint-python.result }}" == "failure" || \
                "${{ needs.test-python-services.result }}" == "failure" || \
                "${{ needs.build-go.result }}" == "failure" || \
                "${{ needs.build-frontend.result }}" == "failure" ]]; then
            echo "::error::Critical CI checks failed"
            exit 1
          fi
          echo "All critical checks passed!"
