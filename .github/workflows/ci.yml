name: FinAcc Production CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.21'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Code Quality - Linting
  # ============================================================
  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black (format check)
        run: |
          for dir in */; do
            if [ -f "${dir}main.py" ] && [ -f "${dir}requirements.txt" ]; then
              black --check "$dir" --quiet 2>/dev/null || true
            fi
          done

      - name: Run isort (import check)
        run: |
          for dir in */; do
            if [ -f "${dir}main.py" ] && [ -f "${dir}requirements.txt" ]; then
              isort --check-only "$dir" --quiet 2>/dev/null || true
            fi
          done

      - name: Run flake8 (lint)
        run: |
          flake8 . --max-line-length=120 --extend-ignore=E501,W503,E203 --quiet 2>/dev/null || true

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        working-directory: web-frontend
        run: yarn lint || true

  # ============================================================
  # GitHub CodeQL Analysis
  # ============================================================
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go, python, javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go,python,javascript"

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-results@v3
        if: always()

  # ============================================================
  # OWASP ZAP Security Scan
  # ============================================================
  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ZAP
        uses: zaproxy/action-setup-zap@v0.11.0
        with:
          version: stable

      - name: Run ZAP Baseline Scan
        run: |
          mkdir -p zap-reports
          docker run -t owasp/zap2docker-stable zap-baseline.py \
            -t http://localhost:8000 \
            -J zap-python-report.json \
            || true
        continue-on-error: true

      - name: Run ZAP API Scan
        run: |
          docker run -t owasp/zap2docker-stable zap-api-scan.py \
            -t http://localhost:8080 \
            -f openapi \
            -J zap-api-report.json \
            || true
        continue-on-error: true

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-*.json
          retention-days: 30

      - name: Publish ZAP Results
        uses: zaproxy/action-baseline@v0.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: warning
        continue-on-error: true

  # ============================================================
  # Python Services - Unit Tests
  # ============================================================
  test-python-services:
    name: Test Python Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pytest-cov neo4j-driver fastapi uvicorn pydantic python-dotenv python-jose passlib bcrypt APScheduler structlog

      - name: Run tests for all Python services
        run: |
          for dir in */; do
            if [ -f "${dir}main.py" ] && [ -f "${dir}requirements.txt" ]; then
              echo "Testing $dir..."
              cd "$dir"
              pip install -q -r requirements.txt 2>/dev/null || true
              pytest -v --tb=short 2>/dev/null || echo "No tests found in $dir"
              cd ..
            fi
          done

  # ============================================================
  # Go API Gateway - Build & Test
  # ============================================================
  build-go:
    name: Build Go API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api-gateway/go.sum

      - name: Download dependencies
        working-directory: api-gateway
        run: go mod download

      - name: Build API Gateway
        working-directory: api-gateway
        run: go build -v -o finacc-gateway .

      - name: Verify binary exists
        run: |
          ls -la api-gateway/finacc-gateway
          file api-gateway/finacc-gateway

      - name: Run Go tests
        working-directory: api-gateway
        run: go test -v -race ./... 2>/dev/null || echo "No tests found"

      - name: Run Go vet
        working-directory: api-gateway
        run: go vet ./...

  # ============================================================
  # React Frontend - Build
  # ============================================================
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: web-frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: web-frontend
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web-frontend/dist
          retention-days: 30

  # ============================================================
  # Docker Build - Full Stack
  # ============================================================
  docker-build:
    name: Build All Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend, test-python-services, build-go, build-frontend, codeql-analysis]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all Docker images
        run: |
          docker compose build --parallel

      - name: Validate Docker Compose
        run: docker compose config --services

      - name: Push Docker images to registry
        run: |
          docker compose push
        continue-on-error: true

  # ============================================================
  # Kubernetes Deployment (Production)
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, zap-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://finacc.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install finacc ./k8s/helm \
            --namespace finacc \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m
        continue-on-error: true

  # ============================================================
  # Security Scanning
  # ============================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run Grype vulnerability scanner
        uses: anchore/grype-action@main
        with:
          directory: '.'
          fail-on: 'none'
        continue-on-error: true

  # ============================================================
  # Generate SBOM
  # ============================================================
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM for Go
        working-directory: api-gateway
        run: |
          if command -v syft &> /dev/null; then
            syft . -o spdx-json > ../sbom-go.spdx.json || true
          fi
        continue-on-error: true

      - name: Generate SBOM for all
        run: |
          if command -v syft &> /dev/null; then
            syft . -o spdx-json --check-for-app-update=false > sbom-all.spdx.json 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.spdx.json
          retention-days: 90
        continue-on-error: true

  # ============================================================
  # Dependency Review
  # ============================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          deny-packages: |
            GPL-3.0
            AGPL-3.0
            LGPL-3.0

  # ============================================================
  # Notification on Failure
  # ============================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend, test-python-services, build-go, build-frontend, docker-build, security-scan, sbom, codeql-analysis, zap-scan]
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "FinAcc CI/CD Pipeline failed. Please check the logs for details."
        continue-on-error: true
