name: Vimbai Production CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Code Quality - Linting
  # ============================================================
  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint bandit safety

      - name: Run Black (format check)
        run: |
          for dir in */; do
            if [ -f "${dir}main.py" ] && [ -f "${dir}requirements.txt" ]; then
              black --check "$dir" --quiet 2>/dev/null || true
            fi
          done

      - name: Run isort (import check)
        run: |
          for dir in */; do
            if [ -f "${dir}main.py" ] && [ -f "${dir}requirements.txt" ]; then
              isort --check-only "$dir" --quiet 2>/dev/null || true
            fi
          done

      - name: Run flake8 (lint)
        run: |
          flake8 . --max-line-length=120 --extend-ignore=E501,W503,E203 --quiet 2>/dev/null || true

      - name: Run Bandit (security lint)
        run: |
          bandit -r . -f json -o bandit-report.json 2>/dev/null || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30
        if: always()

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        working-directory: web-frontend
        run: yarn lint || true

  # ============================================================
  # GitHub CodeQL Analysis (Enhanced)
  # ============================================================
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go, python, javascript, typescript
          queries: security-extended+security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go,python,javascript,typescript"
          upload: always

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-results@v3
        if: always()

  # ============================================================
  # OWASP ZAP Security Scan (Enhanced)
  # ============================================================
  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      scans: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ZAP
        uses: zaproxy/action-setup-zap@v0.14.0
        with:
          version: stable

      - name: Run ZAP Full Scan with API Definition
        run: |
          mkdir -p zap-reports
          # Generate OpenAPI spec for API scan
          cat > zap-reports/openapi.yaml << 'EOF'
          openapi: 3.0.0
          info:
            title: Vimbai API
            version: 1.0.0
          paths:
            /health:
              get:
                responses:
                  '200':
                    description: OK
          EOF

          # Run ZAP API scan with generated spec
          docker run -t owasp/zap2docker-stable:latest zap-api-scan.py \
            -t zap-reports/openapi.yaml \
            -f html \
            -J zap-api-report.json \
            -w zap-api-report.md \
            || true
        continue-on-error: true

      - name: Run ZAP Spider Scan
        run: |
          docker run -t owasp/zap2docker-stable:latest zap-full-scan.py \
            -t https://www.example.com \
            -J zap-spider-report.json \
            -w zap-spider-report.md \
            -r zap-spider-report.html \
            || true
        continue-on-error: true

      - name: Run ZAP Active Scan
        run: |
          docker run -t owasp/zap2docker-stable:latest zap-baseline.py \
            -t https://www.example.com \
            -J zap-baseline-report.json \
            -w zap-baseline-report.md \
            || true
        continue-on-error: true

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-*.json
          retention-days: 30
        if: always()

      - name: Publish ZAP Results
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: warning
          artifact-paths: zap-reports/*.json
        continue-on-error: true

  # ============================================================
  # Dependency Vulnerability Scanning
  # ============================================================
  dependency-vulnerabilities:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Python Safety Check
        run: |
          python -m pip install safety || true
          safety check --json --output safety-report.json 2>/dev/null || true
          safety check --bare 2>/dev/null || true
        continue-on-error: true

      - name: Upload Safety Report
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 30
        if: always()

      - name: Check for known vulnerabilities in requirements
        run: |
          python -m pip install pip-audit || true
          pip-audit --format=json --output pip-audit-report.json 2>/dev/null || true
        continue-on-error: true

      - name: Upload pip-audit Report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30
        if: always()

  # ============================================================
  # Trivy Vulnerability Scanner (Container & Filesystem)
  # ============================================================
  trivy-scan:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: latest

      - name: Scan filesystem for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy FS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: TRIVY-FS
        continue-on-error: true

      - name: Scan for secrets and sensitive data
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scan-mode: 'secret'
          format: 'json'
          output: 'trivy-secrets-report.json'
        continue-on-error: true

      - name: Upload Trivy Secrets Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secrets-report
          path: trivy-secrets-report.json
          retention-days: 30
        if: always()

  # ============================================================
  # Grype Vulnerability Scanner
  # ============================================================
  grype-scan:
    name: Grype Vulnerability Scanner
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Grype vulnerability scan
        uses: anchore/grype-action@main
        with:
          directory: '.'
          format: sarif
          output: 'grype-results.sarif'
          severity-cutoff: medium
          fail-build: false
        continue-on-error: true

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'grype-results.sarif'
          category: GRYPE
        continue-on-error: true

  # ============================================================
  # Python Services - Unit Tests
  # ============================================================
  test-python-services:
    name: Test Python Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pytest-cov neo4j-driver fastapi uvicorn pydantic python-dotenv python-jose passlib bcrypt APScheduler structlog aiohttp

      - name: Run tests for all Python services
        run: |
          for dir in */; do
            if [ -f "${dir}main.py" ] && [ -f "${dir}requirements.txt" ]; then
              echo "Testing $dir..."
              cd "$dir"
              pip install -q -r requirements.txt 2>/dev/null || true
              pytest -v --tb=short 2>/dev/null || echo "No tests found in $dir"
              cd ..
            fi
          done

  # ============================================================
  # Go API Gateway - Build & Test
  # ============================================================
  build-go:
    name: Build Go API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api-gateway/go.sum

      - name: Download dependencies
        working-directory: api-gateway
        run: go mod download

      - name: Verify Go dependencies
        working-directory: api-gateway
        run: go mod verify

      - name: Run Go vulnerability check
        working-directory: api-gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true
        continue-on-error: true

      - name: Build API Gateway
        working-directory: api-gateway
        run: go build -v -o vimbai-gateway .

      - name: Verify binary exists
        run: |
          ls -la api-gateway/vimbai-gateway
          file api-gateway/vimbai-gateway

      - name: Run Go tests
        working-directory: api-gateway
        run: go test -v -race ./... 2>/dev/null || echo "No tests found"

      - name: Run Go vet
        working-directory: api-gateway
        run: go vet ./...

  # ============================================================
  # React Frontend - Build
  # ============================================================
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: web-frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: web-frontend
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web-frontend/dist
          retention-days: 30

  # ============================================================
  # Docker Build - Full Stack
  # ============================================================
  docker-build:
    name: Build All Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend, test-python-services, build-go, build-frontend, codeql-analysis]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all Docker images
        run: |
          docker compose build --parallel

      - name: Validate Docker Compose
        run: docker compose config --services

      - name: Run Trivy on Docker images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-docker-results.sarif \
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:latest || true
        continue-on-error: true

      - name: Push Docker images to registry
        run: |
          docker compose push
        continue-on-error: true

  # ============================================================
  # Kubernetes Deployment (Production)
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, zap-scan, trivy-scan, grype-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://vimbai.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install vimbai ./k8s/helm \
            --namespace vimbai \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m
        continue-on-error: true

  # ============================================================
  # Security Scanning Summary
  # ============================================================
  security-scan:
    name: Security Vulnerability Scan Summary
    runs-on: ubuntu-latest
    needs: [trivy-scan, grype-scan, dependency-vulnerabilities, codeql-analysis]
    if: always()
    steps:
      - name: Summary of Security Scans
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "All security scans completed. Check individual job results for details." >> $GITHUB_STEP_SUMMARY
          echo "- Trivy: Filesystem and container scanning" >> $GITHUB_STEP_SUMMARY
          echo "- Grype: Package vulnerability scanning" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL: Static application security testing" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Check: Python package vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- ZAP: Dynamic application security testing" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Generate SBOM
  # ============================================================
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.0.0

      - name: Generate SBOM for Go
        working-directory: api-gateway
        run: |
          syft . -o spdx-json > ../sbom-go.spdx.json || true

      - name: Generate SBOM for all
        run: |
          syft . -o spdx-json --check-for-app-update=false > sbom-all.spdx.json 2>/dev/null || true

      - name: Upload SBOM to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.spdx.json
          retention-days: 90
        continue-on-error: true

      - name: Upload SBOM to GitHub Security
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:latest
          format: spdx-json
          output-file: sbom-docker.spdx.json
        continue-on-error: true

  # ============================================================
  # Dependency Review
  # ============================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          deny-packages: |
            GPL-3.0
            AGPL-3.0
            LGPL-3.0
            SSPL-1.0
            Commons Clause
          comment-summary-in-pr: always
          license-allowed-list: |
            MIT
            Apache-2.0
            BSD-2-Clause
            BSD-3-Clause
            ISC
            Python-2.0
            0BSD

      - name: Check Go dependencies
        working-directory: api-gateway
        run: |
          go list -m all | head -20
          go mod graph | head -20

  # ============================================================
  # NPM Audit (Frontend Security)
  # ============================================================
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: web-frontend/yarn.lock

      - name: Install dependencies
        working-directory: web-frontend
        run: yarn install --frozen-lockfile

      - name: Run NPM audit
        working-directory: web-frontend
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit --audit-level=high || true
        continue-on-error: true

      - name: Upload NPM audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: web-frontend/npm-audit-report.json
          retention-days: 30
        if: always()

  # ============================================================
  # Notification on Failure
  # ============================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend, test-python-services, build-go, build-frontend, docker-build, security-scan, sbom, codeql-analysis, zap-scan, grype-scan, trivy-scan, dependency-review, npm-audit]
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "Vimbai CI/CD Pipeline failed. Please check the logs for details."
          echo "Security scans completed - check GitHub Security tab for vulnerability reports."
        continue-on-error: true
