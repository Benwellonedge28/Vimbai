name: Vimbai Core CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      - 'api-gateway/**'
      - 'shared/**'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      - 'api-gateway/**'
      - 'shared/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      python_services: ${{ steps.filter.outputs.python_services }}
      go_services: ${{ steps.filter.outputs.go_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BEFORE_SHA=${{ github.event.before }}
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD 2>/dev/null || echo "HEAD~1")
          fi

          # Detect changed Python services
          PYTHON_CHANGED=$(git diff --name-only "$BEFORE_SHA" ${{ github.sha }} 2>/dev/null | grep '\.py$' | cut -d/ -f1 | sort -u | grep -v '^\.' | grep -v '^tests$' | grep -v '^shared$' | grep -v '^migrations$' || true)
          if [ -z "$PYTHON_CHANGED" ]; then
            PYTHON_SERVICES="[]"
          else
            PYTHON_SERVICES=$(echo "$PYTHON_CHANGED" | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "python_services=$PYTHON_SERVICES" >> $GITHUB_OUTPUT

          # Detect changed Go services
          GO_CHANGED=$(git diff --name-only "$BEFORE_SHA" ${{ github.sha }} 2>/dev/null | grep '\.go$' | cut -d/ -f1 | sort -u | grep -v '^\.' || true)
          if [ -z "$GO_CHANGED" ]; then
            GO_SERVICES="[]"
          else
            GO_SERVICES=$(echo "$GO_CHANGED" | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "go_services=$GO_SERVICES" >> $GITHUB_OUTPUT

  test-python:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python_services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.python_services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ${{ matrix.service }}/requirements.txt ]; then
            pip install -r ${{ matrix.service }}/requirements.txt 2>/dev/null || true
          fi
          pip install pytest pytest-cov pytest-asyncio httpx fastapi pydantic structlog
      - name: Run Tests (if present)
        run: |
          if [ -d "${{ matrix.service }}/tests" ]; then
            cd ${{ matrix.service }}
            PYTHONPATH=. python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing || true
          else
            # At least verify every .py file in the dir parses cleanly
            # (covers non-service dirs like scripts/ and brackets/)
            cd ${{ matrix.service }}
            python -c "import ast, pathlib, sys; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path('.').rglob('*.py') if '__pycache__' not in p.parts]; print('Syntax OK')"
          fi
      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false
        continue-on-error: true

  test-go:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.go_services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.go_services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: Download dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download
      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: go test -v -coverprofile=coverage.txt ./... || echo "No tests found"
      - name: Run vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...
