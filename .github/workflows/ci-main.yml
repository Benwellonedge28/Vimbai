name: Vimbai Core CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      - 'gateway/go/**'
      - 'shared/**'
      - 'apps/flutter/**'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      - 'gateway/go/**'
      - 'shared/**'
      - 'apps/flutter/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      go_services: ${{ steps.filter.outputs.go_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BEFORE_SHA=${{ github.event.before }}
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD 2>/dev/null || echo "HEAD~1")
          fi

          # Detect the changed Go modules by walking up from each changed file to the directory holding its go.mod.
          # Taking the first path segment instead named a folder rather than a module: a change to gateway/go/jwt.go
          # yielded "gateway", and the job then ran `go mod download` where no go.mod exists, so the gateway's own
          # tests never ran at all - the pipeline reported a failure about a missing module, which looked like a code
          # problem and was not.
          GO_SERVICES=$(
            git diff --name-only "$BEFORE_SHA" ${{ github.sha }} -- '*.go' '*/go.mod' 2>/dev/null \
            | while IFS= read -r file; do
                dir=$(dirname "$file")
                while [ "$dir" != "." ] && [ "$dir" != "/" ] && [ ! -f "$dir/go.mod" ]; do
                  dir=$(dirname "$dir")
                done
                [ -f "$dir/go.mod" ] && printf '%s\n' "$dir"
              done | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          if [ -z "$GO_SERVICES" ]; then GO_SERVICES="[]"; fi
          echo "go_services=$GO_SERVICES" >> $GITHUB_OUTPUT

  test-go:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.go_services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.go_services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: Download dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download
      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: go test -v -coverprofile=coverage.txt ./...
      - name: Run vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

  # The app's own toolchain, in the pipeline that gates a merge. Dart is not an optional extra here: the client is one of
  # the three languages the platform is written in (ADR-001), so a change that breaks its tests has to fail the same way a
  # broken Rust or Go change does. The version is pinned to the one the app is developed against and the gate in
  # rust/xtask holds every workflow to it.
  test-flutter:
    # The tests prove the Dart compiles; the build at the end proves the *app* does, which is a different claim. A stranger
    # installs an APK, and the plugin, manifest and Gradle questions a phone asks are only answered by building one. Both
    # live in this job because the Dart toolchain is installed in exactly one place, so its pin cannot drift.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up the Java the Android plugin builds with
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Dart toolchain
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.50.0
          cache: true
          cache-sdk: true

      - name: Resolve packages
        working-directory: apps/flutter
        run: flutter pub get

      - name: Check formatting
        working-directory: apps/flutter
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze --no-fatal-infos

      - name: Keep the Gradle caches between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/flutter/android/**/*.gradle*', 'apps/flutter/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Test
        working-directory: apps/flutter
        run: flutter test

      - name: Build the app for a phone
        working-directory: apps/flutter
        run: flutter build apk --debug


