name: Vimbai Core CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      python_services: ${{ steps.filter.outputs.python_services }}
      go_services: ${{ steps.filter.outputs.go_services }}
    steps:
      - uses: actions/checkout@v3
      - id: filter
        run: |
          # Handle new branch pushes where before is 0000000000000000000000000000000000000000
          BEFORE_SHA=${{ github.event.before }}
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA="HEAD~1"
          fi
          git fetch --depth=2 || true
          
          # Detect changed Python services
          PYTHON_CHANGED=$(git diff --name-only $BEFORE_SHA ${{ github.sha }} 2>/dev/null | grep '\.py$' | cut -d/ -f1 | sort -u | grep -v '^\.' | jq -R -s -c 'split("\n")[:-1]' || echo "[]")

          echo "python_services=$PYTHON_CHANGED" >> $GITHUB_OUTPUT

          # Detect changed Go services
          GO_CHANGED=$(git diff --name-only $BEFORE_SHA ${{ github.sha }} 2>/dev/null | grep '\.go$' | cut -d/ -f1 | sort -u | grep -v '^\.' | jq -R -s -c 'split("\n")[:-1]' || echo "[]")
          echo "go_services=$GO_CHANGED" >> $GITHUB_OUTPUT

  test-python:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python_services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.python_services) }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ${{ matrix.service }}/requirements.txt ]; then pip install -r ${{ matrix.service }}/requirements.txt; fi
          pip install pytest pytest-cov ruff bandit
      - name: Lint with Ruff
        run: ruff check ${{ matrix.service }}
      - name: Security Scan with Bandit
        run: bandit -r ${{ matrix.service }} -ll
      - name: Run Tests
        run: |
          cd ${{ matrix.service }}
          PYTHONPATH=. pytest tests/ --cov=. --cov-report=xml
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}

  test-go:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.go_services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.go_services) }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run Tests
        run: |
          cd ${{ matrix.service }}
          go test -v -coverprofile=coverage.txt ./...
      - name: Security Scan with Gosec
        run: |
          curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.18.2
          $(go env GOPATH)/bin/gosec ./...
