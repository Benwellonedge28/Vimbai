name: Vimbai Core CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      - 'gateway/go/**'
      - 'shared/**'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '**/*.py'
      - '**/*.go'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      - 'gateway/go/**'
      - 'shared/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      go_services: ${{ steps.filter.outputs.go_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BEFORE_SHA=${{ github.event.before }}
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD 2>/dev/null || echo "HEAD~1")
          fi

          # Detect changed Go services
          GO_CHANGED=$(git diff --name-only "$BEFORE_SHA" ${{ github.sha }} 2>/dev/null | grep '\.go$' | cut -d/ -f1 | sort -u | grep -v '^\.' || true)
          if [ -z "$GO_CHANGED" ]; then
            GO_SERVICES="[]"
          else
            GO_SERVICES=$(echo "$GO_CHANGED" | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "go_services=$GO_SERVICES" >> $GITHUB_OUTPUT

  test-go:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.go_services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.go_services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: Download dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download
      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: go test -v -coverprofile=coverage.txt ./... || echo "No tests found"
      - name: Run vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...
