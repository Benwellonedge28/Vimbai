name: Observability Stack Validation

on:
  push:
    paths:
      - 'infrastructure/monitoring/**'
      - 'otel-collector-config.yaml'
      - 'prometheus.yml'
    branches: [main, develop]
  pull_request:
    paths:
      - 'infrastructure/monitoring/**'
    branches: [main, develop]

jobs:
  validate-configs:
    name: Validate Observability Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ruby is on the runner image and parses YAML in one line, so validating two configs no longer needs a Python
      # install. json.tool is checked with jq below for the same reason.
      - name: Validate OTel collector config
        run: |
          if [ -f otel-collector-config.yaml ]; then
            ruby -ryaml -e 'YAML.load_file("otel-collector-config.yaml")' && echo "OTel config valid"
          fi

      - name: Validate Prometheus config
        run: |
          if [ -f prometheus.yml ]; then
            ruby -ryaml -e 'YAML.load_file("prometheus.yml")' && echo "Prometheus config valid"
          fi

      - name: Validate Grafana dashboards
        run: |
          for f in infrastructure/monitoring/grafana/dashboards/*.json; do
            jq empty "$f" && echo "$f valid"
          done
