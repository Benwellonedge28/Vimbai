name: Observability Stack Validation

on:
  push:
    paths:
      - 'infrastructure/monitoring/**'
      - 'otel-collector-config.yaml'
      - 'prometheus.yml'
    branches: [main, develop]
  pull_request:
    paths:
      - 'infrastructure/monitoring/**'
    branches: [main, develop]

jobs:
  validate-configs:
    name: Validate Observability Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate OTel collector config
        run: |
          if [ -f otel-collector-config.yaml ]; then
            python -c "import yaml; yaml.safe_load(open('otel-collector-config.yaml'))" && echo "OTel config valid"
          fi

      - name: Validate Prometheus config
        run: |
          if [ -f prometheus.yml ]; then
            python -c "import yaml; yaml.safe_load(open('prometheus.yml'))" && echo "Prometheus config valid"
          fi

      - name: Validate Grafana dashboards
        run: |
          for f in infrastructure/monitoring/grafana/dashboards/*.json; do
            python -c "import json; json.load(open('$f'))" && echo "$f valid"
          done
