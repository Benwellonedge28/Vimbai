name: Publish Docker Images

# The images the cluster actually pulls, built from the Dockerfiles that actually exist.
#
# This workflow used to detect "changed services" by looking for a top-level directory with a Dockerfile in it - a shape the
# Python microservices had and this repository does not - so every matrix entry skipped itself and the job was green while
# publishing nothing, next to manifests asking ghcr.io for images nobody had ever pushed. The set is now stated once, in the
# matrix, and a Dockerfile that is not there fails the build instead of being skipped past.

on:
  push:
    branches: ["main"]
    paths:
      - 'rust/**'
      - 'gateway/go/**'
      - 'infrastructure/docker/**'
      - 'apps/flutter/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      images:
        description: 'Which image to build (calculation-api, sync, worker, api-gateway) or all'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  NAMESPACE: ghcr.io/benwellonedge28/vimbai

jobs:
  # The engine, the worker and the sync server are three entry points into one workspace, so they are one Dockerfile with two
  # build arguments rather than three that would drift apart the first time a dependency changed.
  rust-images:
    name: Build ${{ matrix.image }}
    if: github.event.inputs.images == '' || github.event.inputs.images == 'all' || github.event.inputs.images == matrix.image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: calculation-api
            package: vimbai_api
            bin: vimbai-api
          - image: sync
            package: vimbai_sync
            bin: vimbai-sync
          - image: worker
            package: vimbai_worker
            bin: vimbai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          file: infrastructure/docker/Dockerfile.rust
          context: rust
          platforms: linux/amd64
          push: true
          build-args: |
            PACKAGE=${{ matrix.package }}
            BIN=${{ matrix.bin }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rust-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=rust-${{ matrix.image }}

  gateway-image:
    name: Build api-gateway
    if: github.event.inputs.images == '' || github.event.inputs.images == 'all' || github.event.inputs.images == 'api-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/api-gateway
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          file: infrastructure/docker/Dockerfile.gateway
          context: gateway/go
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the version the gateway reports on /health is the commit it was built from
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
