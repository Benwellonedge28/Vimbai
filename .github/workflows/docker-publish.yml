name: Publish Docker Images

on:
  push:
    branches: ["main"]
    paths:
      - '**/Dockerfile'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/go.sum'
      - '**/package.json'
  workflow_dispatch:
    inputs:
      service:
        description: 'Specific service to build (leave empty for all changed)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: benwellonedge28/vimbai

jobs:
  detect-changed:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.service }}" ]; then
            echo "services=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -oP '^[a-z][a-z0-9-]+/' | sed 's/\///' | sort -u || true)
            if [ -z "$CHANGED" ]; then
              echo "services=[]" >> $GITHUB_OUTPUT
            else
              SERVICES=$(echo "$CHANGED" | jq -R . | jq -s -c .)
              echo "services=$SERVICES" >> $GITHUB_OUTPUT
            fi
          fi

  build-and-push:
    name: Build and Push
    needs: detect-changed
    if: needs.detect-changed.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changed.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile for ${{ matrix.service }}, skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container registry
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
