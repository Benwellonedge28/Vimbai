name: Publish Docker Images

"on":
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      service:
        description: 'Specific service to build (leave empty for all changed)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push
        run: |
          echo "Building Docker images for Vimbai services..."
          # docker build -t ghcr.io/benwellonedge28/vimbai/api-gateway:latest ./api-gateway
          # docker push ghcr.io/benwellonedge28/vimbai/api-gateway:latest
