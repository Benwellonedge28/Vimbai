name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Previous version tag to rollback to (e.g., v1.0.0)'
        required: true
      service:
        description: 'Specific service to rollback (leave empty for all)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    name: Rollback Production Deployment
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for kubeconfig
        id: check
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
            echo "No KUBE_CONFIG_PRODUCTION secret found, skipping rollback"
          else
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes context
        if: steps.check.outputs.has_kubeconfig == 'true'
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Rollback deployments
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          SERVICE="${{ github.event.inputs.service }}"

          if [ -n "$SERVICE" ]; then
            SERVICES=("$SERVICE")
          else
            SERVICES=(
              "api-gateway"
              "identity-service"
              "accounting-service"
              "finance-service"
              "multimodal-pipeline-service"
              "banking-integration-service"
              "supply-chain-service"
              "fraud-detection-service"
              "workflow-service"
              "reporting-service"
            )
          fi

          for SVC in "${SERVICES[@]}"; do
            echo "Rolling back $SVC to $VERSION..."
            kubectl set image deployment/$SVC \
              $SVC=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$SVC:$VERSION \
              -n vimbai
            kubectl rollout status deployment/$SVC -n vimbai --timeout=300s
          done

      - name: Verify rollback
        if: steps.check.outputs.has_kubeconfig == 'true'
        run: |
          kubectl get pods -n vimbai -o wide
          kubectl get deployment -n vimbai

      - name: Skip notification
        if: steps.check.outputs.has_kubeconfig == 'false'
        run: echo "Rollback skipped - no kubeconfig configured"
