name: Core Service Tests

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/Dockerfile'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements-test.txt'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/Dockerfile'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements-test.txt'

# One job per shard + one for the standalone containers (was 43 per-service
# jobs). The shards were originally the bracket groupings; the bracket
# containers themselves were retired on 2026-11-12, the grouping is still a
# cheap way to spread the suite across runners.
# Test failures FAIL the job - no `|| true` masking. pytest exit code 5
# (no tests collected) is tolerated as a skip.
jobs:
  test-core-groups:
    name: Test ${{ matrix.group }}
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: standalone-containers
            services: "identity-service accounting-service finance-service multimodal-pipeline-service banking-integration-service scenario-modeling-service workflow-service budget-service"
          - group: advanced-accounting
            services: "financial-identity-service financial-integrity-service revenue-recognition-service currency-service fixed-assets-register-service general-reserve-service revaluation-reserve-service data-warehouse-service subscription-plans-service intercompany-service      "
          - group: ap-ar-expenses
            services: "expense-tracking-service petty-cash-service purchases-ledger-control-service sales-ledger-control-service "
          - group: corporate-finance
            services: "capital-reconstruction-service capital-redemption-reserve-service cash-optimization-service scenario-analysis-service sensitivity-analysis-service debentures-service "
          - group: costing-budgeting
            services: "appropriation-control-service job-costing-service process-costing-service product-costing-service zero-based-budgeting-service treasury-policy-service treasury-reporting-service treasury-risk-service "
          - group: platform-automation
            services: "automation-engine-service notifications-service webhook-service admin-service "
          - group: platform-infrastructure
            services: "financial-state-machine-service message-bus-service pos-integration-service "
          - group: risk-governance
            services: "risk-assessment-service "
          - group: statements-reporting
            services: "balance-sheet-service cash-flow-statement-service reporting-service "
          - group: partnership
            services: "partnership-agreement-service partnership-changes-service partnership-dissolution-service partnership-revaluation-service "
          - group: tax-audit-investigation
            services: "audit-engagement-service sox-compliance-service "
          - group: treasury-banking
            services: "sovereign-treasury-service treasury-analytics-service treasury-compliance-service treasury-management-service bank-feed-service cash-management-service "

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shared test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements-test.txt 2>/dev/null || pip install -q pytest pytest-asyncio httpx fastapi pydantic structlog uvicorn

      - name: Set test environment
        run: |
          echo "JWT_SECRET=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "NEO4J_PASSWORD=test-password" >> $GITHUB_ENV
          echo "NEO4J_URI=bolt://localhost:7687" >> $GITHUB_ENV
          echo "NEO4J_USER=neo4j" >> $GITHUB_ENV

      - name: Run tests per service (fail on test failure)
        run: |
          FAILED=""
          for svc in ${{ matrix.services }}; do
            echo "::group::${svc}"
            pip install -q -r "${svc}/requirements.txt" 2>/dev/null || true

            ( cd "${svc}" && python -c "import ast; ast.parse(open('main.py').read()); print('Syntax OK: ${svc}')" )

            if [ -d "${svc}/tests" ] && compgen -G "${svc}/tests/test_*.py" > /dev/null; then
              (
                cd "${svc}"
                PYTHONPATH=. python -m pytest tests/ -q --tb=short
                rc=$?
                if [ $rc -eq 5 ]; then
                  echo "No tests collected in ${svc} - skipping"
                  exit 0
                fi
                exit $rc
              ) || FAILED="${FAILED} ${svc}"
            else
              echo "No tests directory in ${svc}"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Test failures in:${FAILED}"
            exit 1
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.group }}
          path: |
            **/tests/**/*.py
          retention-days: 7
