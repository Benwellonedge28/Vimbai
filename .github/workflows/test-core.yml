name: Core Service Tests

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/Dockerfile'
      - 'tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/Dockerfile'
      - 'tests/**'

jobs:
  test-core-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - accounting-service
          - finance-service
          - multimodal-pipeline-service
          - banking-integration-service
          - supply-chain-service
          - fraud-detection-service
          - workflow-service
          - reporting-service
          - automation-engine-service
          - treasury-management-service
          - treasury-compliance-service
          - treasury-analytics-service
          - risk-assessment-service
          - risk-mitigation-service
          - risk-reporting-service
          - investigation-service
          - balance-sheet-service
          - cash-flow-statement-service
          - cost-accounting-service
          - expense-tracking-service
          - revenue-recognition-service
          - corporate-tax-service
          - realtime-calculation-engine
          - sovereign-treasury-service
          - financial-identity-service
          - financial-integrity-service
          - financial-state-machine-service
          - policy-engine-service
          - webhook-service
          - process-costing-service
          - product-costing-service
          - job-costing-service
          - forensic-accounting-service
          - it-audit-service
          - operational-audit-service
          - tax-audit-service
          - scenario-analysis-service
          - cash-optimization-service
          - sensitivity-analysis-service
          - zero-based-budgeting-service
          - appropriation-control-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt 2>/dev/null || true
          pip install -q pytest pytest-asyncio httpx fastapi pydantic structlog uvicorn

      - name: Set test environment
        run: |
          echo "JWT_SECRET=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "NEO4J_PASSWORD=test-password" >> $GITHUB_ENV
          echo "NEO4J_URI=bolt://localhost:7687" >> $GITHUB_ENV
          echo "NEO4J_USER=neo4j" >> $GITHUB_ENV

      - name: Run service syntax check
        working-directory: ${{ matrix.service }}
        run: |
          python -c "import ast; ast.parse(open('main.py').read()); print('Syntax OK')"

      - name: Run tests (if present)
        working-directory: ${{ matrix.service }}
        run: |
          if [ -d tests/ ]; then
            pytest tests/ -v --tb=short || true
          else
            echo "No tests directory in ${{ matrix.service }}"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/tests/
          retention-days: 7

  run-unified-integration-tests:
    name: Unified Integration Tests
    runs-on: ubuntu-latest
    needs: [test-core-services]
    if: always() && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx fastapi pydantic structlog uvicorn

      - name: Run unified integration test suite
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short -q \
            --ignore=tests/test_accounting_service.py \
            --ignore=tests/test_alerts_service.py \
            --ignore=tests/test_api_gateway.py \
            --ignore=tests/test_banking_service.py \
            --ignore=tests/test_notifications_service.py

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-integration-test-results
          path: tests/
          retention-days: 14
