name: Core Service Tests

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/Dockerfile'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements-test.txt'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '**/Dockerfile'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements-test.txt'

# One job per bracket + one for the standalone containers (was 43 per-service
# jobs; services grouped by the domain brackets that already host them).
# Test failures FAIL the job - no `|| true` masking. pytest exit code 5
# (no tests collected) is tolerated as a skip.
jobs:
  test-core-groups:
    name: Test ${{ matrix.group }}
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: standalone-containers
            services: "identity-service accounting-service finance-service multimodal-pipeline-service banking-integration-service supply-chain-service scenario-modeling-service fraud-detection-service workflow-service"
          - group: advanced-accounting-bracket
            services: "cost-accounting-service financial-identity-service financial-integrity-service revenue-recognition-service currency-service"
          - group: ap-ar-expenses-bracket
            services: "expense-tracking-service petty-cash-service purchases-ledger-control-service sales-ledger-control-service"
          - group: corporate-finance-bracket
            services: "cash-optimization-service scenario-analysis-service sensitivity-analysis-service"
          - group: costing-budgeting-bracket
            services: "appropriation-control-service job-costing-service process-costing-service product-costing-service zero-based-budgeting-service"
          - group: platform-automation-bracket
            services: "automation-engine-service notifications-service webhook-service"
          - group: platform-infrastructure-bracket
            services: "financial-state-machine-service policy-engine-service realtime-calculation-engine"
          - group: risk-governance-bracket
            services: "risk-assessment-service risk-mitigation-service"
          - group: statements-reporting-bracket
            services: "balance-sheet-service cash-flow-statement-service reporting-service risk-reporting-service"
          - group: tax-audit-investigation-bracket
            services: "corporate-tax-service forensic-accounting-service investigation-service it-audit-service operational-audit-service tax-audit-service"
          - group: treasury-banking-bracket
            services: "sovereign-treasury-service treasury-analytics-service treasury-compliance-service treasury-management-service bank-feed-service cash-management-service"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shared test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements-test.txt 2>/dev/null || pip install -q pytest pytest-asyncio httpx fastapi pydantic structlog uvicorn

      - name: Set test environment
        run: |
          echo "JWT_SECRET=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "NEO4J_PASSWORD=test-password" >> $GITHUB_ENV
          echo "NEO4J_URI=bolt://localhost:7687" >> $GITHUB_ENV
          echo "NEO4J_USER=neo4j" >> $GITHUB_ENV

      - name: Run tests per service (fail on test failure)
        run: |
          FAILED=""
          for svc in ${{ matrix.services }}; do
            echo "::group::${svc}"
            pip install -q -r "${svc}/requirements.txt" 2>/dev/null || true

            ( cd "${svc}" && python -c "import ast; ast.parse(open('main.py').read()); print('Syntax OK: ${svc}')" )

            if [ -d "${svc}/tests" ] && compgen -G "${svc}/tests/test_*.py" > /dev/null; then
              (
                cd "${svc}"
                PYTHONPATH=. python -m pytest tests/ -q --tb=short
                rc=$?
                if [ $rc -eq 5 ]; then
                  echo "No tests collected in ${svc} - skipping"
                  exit 0
                fi
                exit $rc
              ) || FAILED="${FAILED} ${svc}"
            else
              echo "No tests directory in ${svc}"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Test failures in:${FAILED}"
            exit 1
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.group }}
          path: |
            **/tests/**/*.py
          retention-days: 7
