name: Core Service Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-core-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - accounting-service
          - finance-service
          - multimodal-pipeline-service
          - banking-integration-service
          - supply-chain-service
          - fraud-detection-service
          - workflow-service
          - reporting-service
          - automation-engine-service
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pytest pytest-asyncio
      
      - name: Set test environment
        run: |
          echo "JWT_SECRET=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "NEO4J_PASSWORD=test-password" >> $GITHUB_ENV
          echo "NEO4J_URI=bolt://localhost:7687" >> $GITHUB_ENV
          echo "NEO4J_USER=neo4j" >> $GITHUB_ENV
      
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: pytest tests/ -v --tb=short
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/tests/
          retention-days: 7
