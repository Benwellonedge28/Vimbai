[package]
name = "vimbai_api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "HTTP surface for the Vimbai calculation library. Safe Rust only."

[dependencies]
advisory = { package = "vimbai_advisory", path = "../../crates/calculations/advisory" }
common = { package = "vimbai_common", path = "../../crates/common" }
cost_accounting = { package = "vimbai_cost_accounting", path = "../../crates/calculations/cost_accounting" }
store = { package = "vimbai_store", path = "../../crates/adapters/database" }
accounting = { package = "vimbai_service_accounting", path = "../../crates/domains/accounting" }
budgeting_services = { package = "vimbai_service_budgeting", path = "../../crates/domains/budgeting" }
costing = { package = "vimbai_service_costing", path = "../../crates/domains/costing" }
equity = { package = "vimbai_service_equity", path = "../../crates/domains/equity" }
equity_payroll = { package = "vimbai_equity_payroll", path = "../../crates/calculations/equity_payroll" }
finance = { package = "vimbai_service_finance", path = "../../crates/domains/finance" }
partnerships = { package = "vimbai_service_partnerships", path = "../../crates/domains/partnerships" }
npo = { package = "vimbai_service_npo", path = "../../crates/domains/npo" }
ledger = { package = "vimbai_ledger_services", path = "../../crates/kernel/ledger-services" }
receivables = { package = "vimbai_service_receivables", path = "../../crates/domains/receivables" }
tax_services = { package = "vimbai_service_tax", path = "../../crates/domains/taxation" }
payables = { package = "vimbai_service_payables", path = "../../crates/domains/payables" }
banking = { package = "vimbai_service_banking", path = "../../crates/domains/banking" }
treasury = { package = "vimbai_service_treasury", path = "../../crates/domains/treasury" }
performance_measures = { package = "vimbai_performance_measures", path = "../../crates/calculations/performance_measures" }
treasury_fx = { package = "vimbai_treasury_fx", path = "../../crates/calculations/treasury_fx" }
group_accounting = { package = "vimbai_group_accounting", path = "../../crates/calculations/group_accounting" }
assurance = { package = "vimbai_assurance", path = "../../crates/calculations/assurance" }
bridge = { package = "vimbai_bridge", path = "../../crates/adapters/python-bridge" }
tax = { package = "vimbai_tax", path = "../../crates/calculations/tax" }
ifrs = { package = "vimbai_ifrs", path = "../../crates/calculations/ifrs" }
reporting = { package = "vimbai_reporting", path = "../../crates/calculations/reporting" }
market_risk = { package = "vimbai_market_risk", path = "../../crates/calculations/market_risk" }
budgeting = { package = "vimbai_budgeting", path = "../../crates/calculations/budgeting" }
ratios_statements = { package = "vimbai_ratios_statements", path = "../../crates/calculations/ratios_statements" }
assets = { package = "vimbai_assets", path = "../../crates/domains/assets" }
capital_valuation = { package = "vimbai_capital_valuation", path = "../../crates/calculations/capital_valuation" }
variance = { package = "vimbai_variance", path = "../../crates/calculations/variance" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "vimbai-api"
path = "src/main.rs"
