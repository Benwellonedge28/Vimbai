[package]
name = "vimbai_api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "HTTP surface for the Vimbai calculation library. Safe Rust only."

[dependencies]
advisory = { package = "vimbai_advisory", path = "../calculations/advisory" }
common = { package = "vimbai_common", path = "../common" }
cost_accounting = { package = "vimbai_cost_accounting", path = "../calculations/cost_accounting" }
store = { package = "vimbai_store", path = "../store" }
performance_measures = { package = "vimbai_performance_measures", path = "../calculations/performance_measures" }
treasury_fx = { package = "vimbai_treasury_fx", path = "../calculations/treasury_fx" }
group_accounting = { package = "vimbai_group_accounting", path = "../calculations/group_accounting" }
assurance = { package = "vimbai_assurance", path = "../calculations/assurance" }
bridge = { package = "vimbai_bridge", path = "../bridge" }
tax = { package = "vimbai_tax", path = "../calculations/tax" }
ifrs = { package = "vimbai_ifrs", path = "../calculations/ifrs" }
reporting = { package = "vimbai_reporting", path = "../calculations/reporting" }
market_risk = { package = "vimbai_market_risk", path = "../calculations/market_risk" }
budgeting = { package = "vimbai_budgeting", path = "../calculations/budgeting" }
ratios_statements = { package = "vimbai_ratios_statements", path = "../calculations/ratios_statements" }
assets = { package = "vimbai_assets", path = "../calculations/assets" }
capital_valuation = { package = "vimbai_capital_valuation", path = "../calculations/capital_valuation" }
variance = { package = "vimbai_variance", path = "../calculations/variance" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "vimbai-api"
path = "src/main.rs"
