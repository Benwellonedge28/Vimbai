[package]
name = "vimbai_webhooks"
version = "0.3.0"
edition = "2021"
description = "Webhook service: the endpoints a Book subscribes, the events dispatched to them and how each delivery went."
license = "Proprietary"

[dependencies]
vimbai_common = { path = "../../common" }
vimbai_store = { package = "vimbai_store", path = "../../adapters/database" }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
