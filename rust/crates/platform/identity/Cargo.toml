[package]
name = "vimbai_sso"
version = "0.2.0"
edition = "2021"
description = "Enterprise SSO for Vimbai: OIDC and SAML verification, hardened sessions, internationalised. Safe Rust only."
license = "Proprietary"

[dependencies]
vimbai_common = { path = "../../common" }
vimbai_store = { path = "../../adapters/database" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hmac = "0.12"
indexmap = "2.7.1"
p256 = { version = "0.13", features = ["ecdsa"] }
quick-xml = "0.36"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
bcrypt = "0.15"
