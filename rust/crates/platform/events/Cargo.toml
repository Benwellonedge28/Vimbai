[package]
name = "vimbai_service_events"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Book event bus: publishing an event, the subscriptions that listen, and every delivery attempt."

[dependencies]
vimbai_common = { path = "../../common" }
vimbai_store = { path = "../../adapters/database" }
vimbai_webhooks = { path = "../webhooks" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "time"] }
# the fan-out across pods: one topic exchange, one queue per pod
lapin = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
