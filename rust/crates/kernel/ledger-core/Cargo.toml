[package]
name = "vimbai-ledger-core"
version = "0.1.0"
edition = "2021"
description = "Vimbai's trusted ledger kernel: double-entry validation, immutable hash chain, reversal-entry rules. 100% safe Rust."
license = "MIT"

[lib]
name = "vimbai_ledger_core"
crate-type = ["lib", "cdylib"]

[dependencies]
vimbai_common = { path = "../../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[features]
default = []

