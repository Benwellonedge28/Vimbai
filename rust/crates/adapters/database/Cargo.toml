[package]
name = "vimbai_store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Neo4j-backed record store for the services that still own graph records, Book-scoped like the Python layer it replaces"

[dependencies]
neo4j = "0.2"
vimbai_common = { path = "../../common" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.42.0", features = ["bundled"] }
# the deployment store: pure Rust, so the engine does not need libpq on the machine it runs on
postgres = { version = "0.19", features = ["with-serde_json-1"] }

[dev-dependencies]
tempfile = "3"
