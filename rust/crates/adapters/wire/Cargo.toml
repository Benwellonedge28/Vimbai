[package]
name = "vimbai_bridge"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "The JSON door onto the Vimbai calculation libraries: one shape per endpoint, the single wire source"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bigdecimal = { version = "0.4", features = ["serde"] }
vimbai_advisory = { path = "../../calculations/advisory" }
vimbai_common = { path = "../../common" }
vimbai_budgeting = { path = "../../calculations/budgeting" }
vimbai_cost_accounting = { path = "../../calculations/cost_accounting" }
vimbai_assets = { path = "../../domains/assets" }
vimbai_capital_valuation = { path = "../../calculations/capital_valuation" }
vimbai_ifrs = { path = "../../calculations/ifrs" }
vimbai_reporting = { path = "../../calculations/reporting" }
vimbai_ratios_statements = { path = "../../calculations/ratios_statements" }
vimbai_tax = { path = "../../calculations/tax" }
vimbai_treasury_fx = { path = "../../calculations/treasury_fx" }
vimbai_group_accounting = { path = "../../calculations/group_accounting" }
vimbai_tax_reporting = { path = "../../calculations/tax_reporting" }
vimbai_performance_measures = { path = "../../calculations/performance_measures" }
vimbai_market_risk = { path = "../../calculations/market_risk" }
