[workspace]
resolver = "2"
# native/ is its own workspace: it links against libpython and must not be
# pulled into `cargo test --workspace` for the calculation crates.
members = [
    "crates/common",
    "apps/api-server",
    "apps/local-runtime",
    "apps/worker",
    "xtask",
    "tests/financial-integrity",
    "crates/adapters/database",
    "crates/adapters/wire",
    "crates/domains/automation",
    "crates/domains/accounting",
    "crates/domains/budgeting",
    "crates/domains/costing",
    "crates/domains/analytics",
    "crates/domains/data",
    "crates/domains/equity",
    "crates/domains/finance",
    "crates/domains/npo",
    "crates/domains/taxation",
    "crates/domains/partnerships",
    "crates/domains/payables",
    "crates/domains/banking",
    "crates/domains/receivables",
    "crates/domains/reporting",
    "crates/domains/compliance",
    "crates/domains/identity",
    "crates/application",
    "crates/platform/integrations",
    "crates/domains/invoicing",
    "crates/domains/multimodal",
    "crates/domains/workflow",
    "crates/platform/events",
    "crates/platform/offline-sync",
    "crates/domains/payments",
    "crates/domains/payroll",
    "crates/domains/security",
    "crates/domains/audit",
    "crates/domains/treasury",
    "crates/platform/identity",
    "crates/platform/tenancy",
    "crates/platform/documents",
    "crates/platform/alerts",
    "crates/platform/notifications",
    "crates/platform/webhooks",
    "crates/platform/admin",
    "crates/platform/cache",
    "crates/platform/access-control/rbac",
    "crates/platform/access-control/abac",
    "crates/kernel/ledger-core",
    "crates/kernel/ledger-services",
    "crates/calculations/advisory",
    "crates/domains/assets",
    "crates/calculations/assurance",
    "crates/calculations/budgeting",
    "crates/calculations/capital_valuation",
    "crates/calculations/cost_accounting",
    "crates/calculations/equity_payroll",
    "crates/calculations/group_accounting",
    "crates/calculations/ifrs",
    "crates/calculations/market_risk",
    "crates/calculations/performance_measures",
    "crates/calculations/ratios_statements",
    "crates/calculations/reporting",
    "crates/calculations/tax",
    "crates/calculations/tax_reporting",
    "crates/calculations/treasury_fx",
    "crates/calculations/variance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Samuel Mukandara"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bigdecimal = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
