openapi: 3.1.0
info:
  title: Vimbai unattributed
  version: "1.0.0"
  summary: The addresses the unattributed domain answers, generated from the engine's route table.
  description: |
    Generated by `cargo run -p xtask -- openapi` from the routes the engine answers. Do not edit by hand:
    regenerating is how it changes.

    What is stated here is what the generator can know: the path, the methods answered on it, and the
    components every Vimbai service shares. Response schemas are not generated, because a schema nobody
    checked is a promise nobody keeps - the wire shapes are pinned by the per-domain HTTP tests instead.

    These addresses answer, and a client may call them, but no service in `catalog/services` claims their
    prefix: they are the retired services' own addresses, still answered from the same handlers so that a client
    which was never repointed keeps working. They are collected here rather than given a file each because a file
    named after a prefix nobody maintains documents nothing. Attaching them to the catalogue is an open task.

    The addresses this file covers, by prefix group:
    * `/access-policies`
    * `/account-rules`
    * `/account-types`
    * `/accounting-equation`
    * `/amortize`
    * `/analytics`
