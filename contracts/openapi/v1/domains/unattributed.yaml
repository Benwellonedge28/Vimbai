servers:
  - url: https://api.vimbai.example
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BookId:
      name: X-Book-Id
      in: header
      required: true
      description: The Book the caller is asking about. A token for one Book cannot read another.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [error]
      description: The one error shape every Vimbai address answers with.
      properties:
        error:
          type: string
  responses:
    Answered:
      description: The answer the handler gives.
      content:
        application/json:
          schema: {}
    Unauthorized:
      description: No usable token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not this caller's Book.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Refused:
      description: The request was understood and refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /access-policies:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      operationId: getAccessPolicies
      responses: { "200": { $ref: "#/components/responses/Answered" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "422": { $ref: "#/components/responses/Refused" } }
    post:
      operationId: postAccessPolicies
      responses: { "200": { $ref: "#/components/responses/Answered" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "422": { $ref: "#/components/responses/Refused" } }
