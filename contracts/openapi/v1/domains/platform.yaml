openapi: 3.1.0
info:
  title: Vimbai platform
  version: "1.0.0"
  summary: The addresses the platform domain answers, generated from the engine's route table.
  description: |
    Generated by `cargo run -p xtask -- openapi` from the routes the engine answers. Do not edit by hand:
    regenerating is how it changes.

    What is stated here is what the generator can know: the path, the methods answered on it, and the
    components every Vimbai service shares. Response schemas are not generated, because a schema nobody
    checked is a promise nobody keeps - the wire shapes are pinned by the per-domain HTTP tests instead.

    The addresses this file covers, by prefix group:
    * `/approval`
    * `/audit-logs`
    * `/backup`
    * `/backups`
    * `/books`
    * `/bus`
    * `/cache-stats`
    * `/config`
    * `/deliveries`
    * `/dimensions`
    * `/dispatch`
    * `/document-statistics`
    * `/endpoints`
    * `/event-types`
    * `/facts`
    * `/feature-categories`
    * `/feature-requests`
    * `/features`
    * `/files`
    * `/identity`
    * `/inbox`
    * `/mfa`
    * `/notification-stats`
    * `/notification-templates`
    * `/organizations`
    * `/pipelines`
    * `/preferences`
    * `/profiles`
    * `/query`
    * `/restores`
    * `/rollout-schedules`
    * `/services`
servers:
  - url: https://api.vimbai.example
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BookId:
      name: X-Book-Id
      in: header
      required: true
      description: The Book the caller is asking about. A token for one Book cannot read another.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [error]
      description: The one error shape every Vimbai address answers with.
      properties:
        error:
          type: string
  responses:
    Answered:
      description: The answer the handler gives.
      content:
        application/json:
          schema: {}
    Unauthorized:
      description: No usable token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not this caller's Book.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Refused:
      description: The request was understood and refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
