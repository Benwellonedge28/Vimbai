# Prometheus Configuration for Vimbai
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel_collector:8889']

  # API Gateway metrics (if exposed)
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api_gateway:8081']
    metrics_path: /metrics
    scrape_interval: 30s

  # Core Python services
  - job_name: 'core-services'
    static_configs:
      - targets:
          - 'identity_service:8080'
          - 'accounting_service:8000'
          - 'finance_service:8001'
          - 'banking_integration_service:8003'
          - 'fraud_detection_service:8005'
    metrics_path: /metrics
    scrape_interval: 30s

  # Infrastructure
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:2004']
    scrape_interval: 60s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 60s

  # Production services (auto-discovered via file-based SD)
  - job_name: 'production-services'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/production-services.json
        refresh_interval: 30s
