# Vimbai Helm Chart Values
global:
  imageRegistry: ghcr.io
  imageRepository: benwellonedge28/vimbai
  imagePullPolicy: Always
  namespace: vimbai

# Neo4j Configuration
neo4j:
  enabled: true
  image: neo4j:5-community
  auth:
    password: ""  # Must be set via --set or values-production.yaml
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: standard

# RabbitMQ Configuration
rabbitmq:
  enabled: true
  image: rabbitmq:3-management-alpine
  auth:
    user: ""  # Must be set
    password: ""  # Must be set
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# API Gateway
apiGateway:
  enabled: true
  replicas: 2
  port: 8081
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  rateLimit:
    enabled: true
    rps: 100
    burst: 200

# Identity Service
identityService:
  enabled: true
  replicas: 3
  port: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Accounting Service
accountingService:
  enabled: true
  replicas: 3
  port: 8000
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  hpa:
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilization: 70

# Core Services (default config for all other services)
coreServices:
  replicas: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    scrapeInterval: 15s
  grafana:
    enabled: true

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - name: api.vimbai.com
      service: api-gateway
      port: 8081
    - name: app.vimbai.com
      service: web-frontend
      port: 80
  tls:
    enabled: true
    secretName: vimbai-tls

# Security
security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  networkPolicy:
    enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
