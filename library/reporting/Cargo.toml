[package]
name = "vimbai_reporting"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Report preparation: annual report checklists and filing readiness"

[dependencies]
vimbai_common = { path = "../common" }
serde = { workspace = true }
# preserve_order keeps a caller's line items in the order they arrived
serde_json = { workspace = true, features = ["preserve_order"] }
# preserve_order is backed by indexmap, and indexmap 2.12 onward needs cargo
# 1.85 for edition2024. The library CI builds the wheel in the maturin 1.7.4
# image, which carries cargo 1.81, so the version is held below that line.
indexmap = { version = "=2.7.1", features = ["serde"] }
