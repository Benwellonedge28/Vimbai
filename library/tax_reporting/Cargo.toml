[package]
name = "vimbai_tax_reporting"
version = "0.1.0"
edition = "2021"
description = "Vimbai tax calculations: R&D credit, group tax, VAT, provisions, risk, grants, XBRL. Safe Rust only."
license = "Proprietary"

[dependencies]
vimbai_common = { path = "../common" }
indexmap = { version = "2.7.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
