[workspace]
resolver = "2"
members = [
    "common",
    "variance",
    "capital_valuation",
    "cost_accounting",
    "budgeting",
    "ifrs",
    "treasury_fx",
    "tax",
    "assets",
    "ratios_statements",
    "equity_payroll",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Samuel Mukandara"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
