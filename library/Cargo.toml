[workspace]
resolver = "2"
# native/ is its own workspace: it links against libpython and must not be
# pulled into `cargo test --workspace` for the calculation crates.
exclude = ["native"]
members = [
    "common",
    "api",
    "advisory",
    "automation",
    "sso",
    "rbac",
    "abac",
    "tax_reporting",
    "group_accounting",
    "performance_measures",
    "market_risk",
    "variance",
    "capital_valuation",
    "cost_accounting",
    "budgeting",
    "ifrs",
    "treasury_fx",
    "tax",
    "assets",
    "ratios_statements",
    "equity_payroll",
    "reporting",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Samuel Mukandara"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bigdecimal = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
