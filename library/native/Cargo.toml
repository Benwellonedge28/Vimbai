[package]
name = "vimbai_native"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Python seam for the Vimbai calculation libraries (PyO3)"

[workspace]

[lib]
name = "vimbai_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py39"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bigdecimal = { version = "0.4", features = ["serde"] }
vimbai_common = { path = "../common" }
vimbai_budgeting = { path = "../budgeting" }
vimbai_cost_accounting = { path = "../cost_accounting" }
vimbai_assets = { path = "../assets" }
vimbai_capital_valuation = { path = "../capital_valuation" }
vimbai_ifrs = { path = "../ifrs" }
vimbai_reporting = { path = "../reporting" }
vimbai_ratios_statements = { path = "../ratios_statements" }
vimbai_tax = { path = "../tax" }
vimbai_treasury_fx = { path = "../treasury_fx" }
vimbai_group_accounting = { path = "../group_accounting" }
vimbai_tax_reporting = { path = "../tax_reporting" }

[features]
# Off by default so `cargo test` can link libpython and exercise the seam
# arms directly; maturin turns it on for the real extension build.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
