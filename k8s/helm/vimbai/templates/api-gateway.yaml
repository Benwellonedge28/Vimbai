---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
    spec:
      serviceAccountName: vimbai-sa
      containers:
        - name: api-gateway
          image: {{ .Values.global.imageRegistry }}/api-gateway:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vimbai-secrets
                  key: jwt-secret
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:8080"
            - name: ACCOUNTING_SERVICE_URL
              value: "http://accounting-service:8000"
            - name: FINANCE_SERVICE_URL
              value: "http://finance-service:8001"
            - name: MULTIMODAL_SERVICE_URL
              value: "http://multimodal-pipeline-service:8002"
            - name: BANKING_INTEGRATION_SERVICE_URL
              value: "http://banking-integration-service:8003"
            - name: SUPPLY_CHAIN_SERVICE_URL
              value: "http://supply-chain-service:8004"
            - name: FRAUD_DETECTION_SERVICE_URL
              value: "http://fraud-detection-service:8005"
          {{- include "vimbai.resources" (dict "requests" .Values.apiGateway.resources.requests "limits" .Values.apiGateway.resources.limits) | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilization }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: {{ .Values.global.namespace }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: api-gateway
{{- end }}
