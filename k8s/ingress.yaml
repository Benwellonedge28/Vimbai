# Vimbai Ingress Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vimbai-ingress
  namespace: vimbai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1s"
spec:
  tls:
  - hosts:
    - api.vimbai.com
    - app.vimbai.com
    secretName: vimbai-tls
  rules:
  - host: api.vimbai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
  - host: app.vimbai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80