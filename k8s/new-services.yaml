# Alerts Service Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-service
  namespace: finacc
  labels:
    app: alerts-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alerts-service
  template:
    metadata:
      labels:
        app: alerts-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      containers:
      - name: alerts-service
        image: finacc/alerts-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: PORT
          value: "8090"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: alerts-service
  namespace: finacc
  labels:
    app: alerts-service
spec:
  selector:
    app: alerts-service
  ports:
  - name: http
    port: 8090
    targetPort: 8090

