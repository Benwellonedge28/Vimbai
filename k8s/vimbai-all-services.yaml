---
apiVersion: v1
kind: Namespace
metadata:
  name: vimbai
  labels:
    app.kubernetes.io/part-of: vimbai
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: vimbai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: vimbai
  labels:
    app: neo4j
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.20-community
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: vimbai-secrets
                  key: neo4j-auth
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: neo4j-data
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: vimbai
spec:
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vimbai
  labels:
    app: redis
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vimbai
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vimbai-config
  namespace: vimbai
data:
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  REDIS_URL: "redis://redis:6379"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: vimbai-secrets
  namespace: vimbai
type: Opaque
stringData:
  neo4j-auth: "neo4j/dev-password"
  jwt-secret: "change-me-in-production"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vimbai-sa
  namespace: vimbai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: vimbai
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: vimbai-sa
      containers:
        - name: api-gateway
          image: ghcr.io/benwellonedge28/vimbai/api-gateway:latest
          ports:
            - containerPort: 8081
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vimbai-secrets
                  key: jwt-secret
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:8080"
            - name: ACCOUNTING_SERVICE_URL
              value: "http://accounting-service:8000"
            - name: FINANCE_SERVICE_URL
              value: "http://finance-service:8001"
            - name: MULTIMODAL_SERVICE_URL
              value: "http://multimodal-pipeline-service:8002"
            - name: BANKING_INTEGRATION_SERVICE_URL
              value: "http://banking-integration-service:8003"
            - name: SUPPLY_CHAIN_SERVICE_URL
              value: "http://supply-chain-service:8004"
            - name: FRAUD_DETECTION_SERVICE_URL
              value: "http://fraud-detection-service:8005"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: vimbai
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: vimbai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: absorption-costing-service
  namespace: vimbai
  labels:
    app: absorption-costing-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: absorption-costing-service
  template:
    metadata:
      labels:
        app: absorption-costing-service
    spec:
      serviceAccountName: vimbai-sa
      containers:
        - name: absorption-costing-service
          image: ghcr.io/benwellonedge28/vimbai/absorption-costing-service:latest
          ports:
            - containerPort: 8010
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
          envFrom:
            - configMapRef:
                name: vimbai-config
            - secretRef:
                name: vimbai-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 20
