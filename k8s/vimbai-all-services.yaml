    app: zero-trust-data-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zero-trust-data-service
  template:
    metadata:
      labels:
        app: zero-trust-data-service
    spec:
      serviceAccountName: vimbai-sa
      containers:
        - name: zero-trust-data-service
          image: ghcr.io/benwellonedge28/vimbai/zero-trust-data-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
          envFrom:
            - configMapRef:
                name: vimbai-config
            - secretRef:
                name: vimbai-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: zero-trust-data-service
  namespace: vimbai
spec:
  type: ClusterIP
  selector:
    app: zero-trust-data-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: vimbai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-services-pdb
  namespace: vimbai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      tier: backend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vimbai-network-policy
  namespace: vimbai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: gateway
        - podSelector:
            matchLabels:
              tier: infrastructure
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: infrastructure
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vimbai-ingress
  namespace: vimbai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.vimbai.com
      secretName: vimbai-tls
  rules:
    - host: api.vimbai.com
      http:
        paths:
          - path: /v1/()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081
