apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: vimbai
  labels:
    app: notifications-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      serviceAccountName: vimbai-sa
      containers:
        - name: notifications-service
          image: ghcr.io/benwellonedge28/vimbai/notifications-service:latest
          ports:
            - containerPort: 8091
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
          envFrom:
            - configMapRef:
                name: vimbai-config
            - secretRef:
                name: vimbai-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: vimbai
spec:
  type: ClusterIP
  selector:
    app: notifications-service
  ports:
    - port: 8091
      targetPort: 8091
