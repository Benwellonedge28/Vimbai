apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vimbai-network-policy
  namespace: vimbai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: gateway
        - podSelector:
            matchLabels:
              tier: infrastructure
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: infrastructure
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vimbai-ingress
  namespace: vimbai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.vimbai.com
      secretName: vimbai-tls
  rules:
    - host: api.vimbai.com
      http:
        paths:
          - path: /v1/()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081
