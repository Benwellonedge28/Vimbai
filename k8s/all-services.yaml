apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: vimbai
  labels:
    app: reporting-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8361"
    spec:
      containers:
      - name: reporting-service
        image: ghcr.io/benwellonedge28/vimbai/reporting-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8361
          name: http
        env:
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: vimbai-config
              key: NEO4J_URI
        - name: NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: vimbai-config
              key: NEO4J_USER
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: NEO4J_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: JWT_SECRET
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: RABBITMQ_PASS
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8361
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8361
          initialDelaySeconds: 10
          periodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: reporting-service
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: vimbai
  labels:
    app: reporting-service
spec:
  selector:
    app: reporting-service
  ports:
  - name: http
    port: 8361
    targetPort: 8361
