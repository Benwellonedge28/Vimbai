spec:
  selector:
    app: realtime-calculation-engine
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulatory-compliance-service
  namespace: vimbai
  labels:
    app: regulatory-compliance-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: regulatory-compliance-service
  template:
    metadata:
      labels:
        app: regulatory-compliance-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8285"
    spec:
      containers:
      - name: regulatory-compliance-service
        image: ghcr.io/benwellonedge28/vimbai/regulatory-compliance-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8285
          name: http
        env:
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: vimbai-config
              key: NEO4J_URI
        - name: NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: vimbai-config
              key: NEO4J_USER
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: NEO4J_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: JWT_SECRET
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: RABBITMQ_PASS
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8285
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8285
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: regulatory-compliance-service
  namespace: vimbai
  labels:
    app: regulatory-compliance-service
spec:
  selector:
    app: regulatory-compliance-service
  ports:
  - name: http
    port: 8285
    targetPort: 8285
