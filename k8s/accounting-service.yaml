# Accounting Service Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-service
  namespace: vimbai
  labels:
    app: accounting-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: accounting-service
  template:
    metadata:
      labels:
        app: accounting-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: accounting-service
        image: vimbai/accounting-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: vimbai-config
              key: NEO4J_URI
        - name: NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: vimbai-config
              key: NEO4J_USER
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: NEO4J_PASSWORD
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_SERVICE_NAMESPACE
          value: vimbai
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
# Accounting Service
apiVersion: v1
kind: Service
metadata:
  name: accounting-service
  namespace: vimbai
  labels:
    app: accounting-service
spec:
  selector:
    app: accounting-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
# Accounting Service HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: accounting-service-hpa
  namespace: vimbai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: accounting-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70