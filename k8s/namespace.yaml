# FinAcc Kubernetes Configuration
# Production-ready Kubernetes manifests for all microservices

---
# Namespace for FinAcc services
apiVersion: v1
kind: Namespace
metadata:
  name: finacc
  labels:
    name: finacc
    environment: production

---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: finacc-config
  namespace: finacc
data:
  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_USER: "neo4j"
  LOG_LEVEL: "INFO"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  REDIS_URL: "redis://redis-service:6379"
  ALLOWED_ORIGINS: "https://app.finacc.com"

---
# Secret for sensitive configuration (use sealed-secrets or vault in production)
apiVersion: v1
kind: Secret
metadata:
  name: finacc-secrets
  namespace: finacc
type: Opaque
stringData:
  NEO4J_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
  GITHUB_CLIENT_ID: "YOUR_GITHUB_CLIENT_ID"
  GITHUB_CLIENT_SECRET: "YOUR_GITHUB_CLIENT_SECRET"