  namespace: vimbai
  labels:
    app: ifrs-reporting
    tier: backend
    service-group: new-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ifrs-reporting
  template:
    metadata:
      labels:
        app: ifrs-reporting
        tier: backend
        service-group: new-services
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8268"
    spec:
      containers:
      - name: ifrs-reporting
        image: vimbai/ifrs-reporting-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8268
          name: http
        env:
        - name: PORT
          value: "8268"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: jwt-secret
        - name: NEO4J_URI
          value: "bolt://neo4j:7687"
        - name: NEO4J_USER
          value: "neo4j"
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: neo4j-password
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8268
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8268
          initialDelaySeconds: 15
          periodSeconds: 20
---
