# Kubernetes Manifests for 31 New Vimbai Services
# Generated from api-gateway/config/services.json
# Each service gets a Deployment (2 replicas) + ClusterIP Service

---
# lifecycle-costing-service Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifecycle-costing
  namespace: vimbai
  labels:
    app: lifecycle-costing
    tier: backend
    service-group: new-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lifecycle-costing
  template:
    metadata:
      labels:
        app: lifecycle-costing
        tier: backend
        service-group: new-services
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8182"
    spec:
      containers:
      - name: lifecycle-costing
        image: vimbai/lifecycle-costing-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8182
          name: http
        env:
        - name: PORT
          value: "8182"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: jwt-secret
        - name: NEO4J_URI
          value: "bolt://neo4j:7687"
        - name: NEO4J_USER
          value: "neo4j"
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vimbai-secrets
              key: neo4j-password
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8182
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8182
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: lifecycle-costing
  namespace: vimbai
  labels:
    app: lifecycle-costing
spec:
  selector:
    app: lifecycle-costing
  ports:
  - name: http
    port: 8182
    targetPort: 8182
---
