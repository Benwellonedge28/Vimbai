apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vimbai

resources:
- namespace.yaml
- api-gateway.yaml
- identity-service.yaml
- accounting-service.yaml
- new-services.yaml
- all-services.yaml
- ingress.yaml
- pod-disruption-budgets.yaml
- network-policies.yaml
- tracing.yaml
- neo4j-backup-cronjob.yaml
- neo4j-backup-pvc.yaml

commonLabels:
  app.kubernetes.io/name: vimbai
  app.kubernetes.io/part-of: vimbai

configMapGenerator:
- name: vimbai-config
  literals:
  - LOG_LEVEL=INFO
  - NEO4J_URI=bolt://neo4j:7687
  - NEO4J_USER=neo4j
  - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
  - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
  - OTEL_SERVICE_NAMESPACE=vimbai

secretGenerator:
- name: vimbai-secrets
  type: Opaque
  envs:
  - secrets.env
