# Vimbai Kustomization Configuration
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vimbai

resources:
- namespace.yaml
- api-gateway.yaml
- identity-service.yaml
- accounting-service.yaml
- new-services.yaml
- ingress.yaml

commonLabels:
  app.kubernetes.io/name: vimbai
  app.kubernetes.io/part-of: vimbai

vars:
- name: NEO4J_URI
  objref:
    kind: ConfigMap
    name: vimbai-config
    apiVersion: v1
    fieldref:
      fieldPath: data.NEO4J_URI

configMapGenerator:
- name: vimbai-config
 literals:
  - LOG_LEVEL=INFO

secretGenerator:
- name: vimbai-secrets
  type: Opaque
  envs:
  - secrets.env

images:
- name: vimbai/api-gateway
  newTag: latest
- name: vimbai/identity-service
  newTag: latest
- name: vimbai/accounting-service
  newTag: latest
- name: vimbai/alerts-service
  newTag: latest
- name: vimbai/notifications-service
  newTag: latest
- name: vimbai/currency-service
  newTag: latest